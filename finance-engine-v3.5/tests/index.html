<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Finance Engine Tests</title>
  <style>
    body { font: 14px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif; margin: 0 auto; max-width: 960px; padding: 16px; color: #1b1f24; background: #fff; }
    code, .error { font-family: Consolas, Menlo, monospace; font-size: 12px; }
    .summary { font-size: 1.2rem; font-weight: 700; padding: 8px 12px; border-radius: 6px; background: #f6f8fa; }

    .fail { color: #a40e26; }
    .error { white-space: pre-wrap; color: #57606a; margin: 0 0 8px 20px; }

  <script src="browser-suites.js" defer></script>

<body>
  <h1>Finance Engine: browser tests</h1>

  <div id="results"></div>
