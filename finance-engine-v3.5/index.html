<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Project Finance Portfolio Engine</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/gitbrent/PptxGenJS@3.12.0/dist/pptxgen.bundle.js"></script>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="hdr">
      <h1>💰 Project Finance Portfolio Engine</h1>
      <span style="font-size: 0.75rem; opacity: 0.7">v3.5</span
      ><span
        style="font-size: 0.6rem; opacity: 0.35; margin-left: auto; font-style: italic"
        title="github.com/LoneWolfDen"
        >🐺 VY</span
      >
    </div>
    <div class="nav" id="nav"></div>
    <div class="content" id="app"></div>
    <script src="data/defaults.js"></script>
    <script src="data/holidays.js"></script>
    <script src="js/core/storage.js"></script>
    <script src="js/core/forecast.js"></script>
    <script src="js/core/model.js"></script>
    <script src="js/ui/shell.js"></script>
    <script src="js/ui/html.js"></script>
    <script src="js/ui/chart-helpers.js"></script>
    <script src="js/tabs/overview.js"></script>
    <script src="js/tabs/burndown.js"></script>
    <script src="js/tabs/variance.js"></script>
    <script src="js/tabs/po-details.js"></script>
    <script src="js/tabs/invoices.js"></script>
    <script src="js/tabs/resources.js"></script>
    <script src="js/tabs/utilization.js"></script>
    <script src="js/tabs/expenses.js"></script>
    <script src="js/tabs/scenarios.js"></script>
    <script src="js/tabs/data-reports.js"></script>
    <script src="js/tabs/settings.js"></script>
    <script src="js/exports.js"></script>
    <script src="js/main.js"></script>
    <button class="chat-toggle" onclick="toggleChatPanel()" title="AI Assistant">🤖</button>
    <div class="chat-panel" id="chatPanel">
      <div class="chat-hdr">
        <span>🤖 AI Assistant</span>
        <div>
          <button
            onclick="switchChatMode()"
            id="chatModeBtn"
            style="
              font-size: 0.6rem;
              border: 1px solid rgba(255, 255, 255, 0.3);
              border-radius: 3px;
              padding: 1px 6px;
              margin-right: 4px;
            "
          >
            Mode</button
          ><button onclick="document.getElementById('chatPanel').classList.remove('open')">✕</button>
        </div>
      </div>
      <div id="chatBody">
        <div class="chat-msgs" id="chatMsgs">
          <div class="chat-msg ai">
            Hi! Ask about budget, burn rate, resources, forecast, actuals, invoices, or a person's name.<br /><span
              style="font-size: 0.65rem; color: #888"
              >Mode: <span id="chatModeLabel">Smart (Local)</span> · Click Mode to switch (Smart → Ollama →
              Copilot)</span
            >
          </div>
        </div>
        <div class="chat-input">
          <input
            id="chatIn"
            placeholder="Ask about your data..."
            onkeydown="if(event.key==='Enter')sendChat()"
          /><button onclick="sendChat()">Send</button>
        </div>
      </div>
      <div id="copilotFrame" style="display: none; flex: 1">
        <iframe id="copilotIframe" style="width: 100%; height: 420px; border: none"></iframe>
      </div>
    </div>
    <script src="js/chat.js"></script>
  </body>
</html>
