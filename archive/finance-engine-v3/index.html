// Parse PO_Validity "mm-yy" → end-of-month Date; also supports legacy year (2025) and "mm-yyyy"
function parseValidityEnd(v){
  if(!v)return new Date('2025-12-31');
  const s=String(v).trim();
  if(/^\d{4}$/.test(s))return new Date(parseInt(s),11,31); // legacy: year only
  const parts=s.split('-');
  if(parts.length===2){
    let mm=parseInt(parts[0]),yy=parts[1];
    if(yy.length===2)yy='20'+yy;
    const yr=parseInt(yy);
    return new Date(yr,mm,0); // last day of month mm in year yr
  }
  return new Date('2025-12-31');
}

  return !hols.has(d.toISOString().slice(0,10));
}

// Effective-dated FX lookup: latest rate on or before asOfDate
function fxRateAsOf(fxRates,code,asOfDate){
  let best=null,bestDt='';
  fxRates.forEach(r=>{if(r.code===code&&r.effective<=asOfDate&&r.effective>bestDt){best=r.rate;bestDt=r.effective;}});
  return best||1;
}

// Effective-dated rate lookup for a resource: find the rule where start<=date<=end
function findResourceRule(resources,emplId,poTeam,asOfDate){
  // Find the rule with latest start date that is <= asOfDate and end >= asOfDate
  let best=null;
  resources.forEach(r=>{
    if(r.empl_id===emplId&&(r.po_team||'')===(poTeam||'')&&r.start<=asOfDate&&r.end>=asOfDate){
      if(!best||r.start>best.start)best=r;
    }
  });
  return best;
}

// OT multiplier lookup
function otMultiplier(otParams,poTeam,otType,asOfDate){
  let best=null,bestDt='';
  otParams.forEach(r=>{if(r.type===otType&&r.effective<=asOfDate&&r.effective>bestDt){best=r.multiplier;bestDt=r.effective;}});
  return best||1;
}

// Parse date: handles dd/mm/yyyy, mm/dd/yyyy, yyyy-mm-dd, m/d/yyyy
// format hint: 'uk'=dd/mm/yyyy, 'us'=mm/dd/yyyy, auto=detect
function parseDate(s,format){
  if(!s)return '';
  s=String(s).trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10); // already ISO
  const parts=s.split(/[\/\-]/);
  if(parts.length===3){
    let a=parseInt(parts[0]),b=parseInt(parts[1]),y=parts[2];
    if(y.length===2)y='20'+y;
    if(y.length===4){
      if(format==='uk')return `${y}-${String(b).padStart(2,'0')}-${String(a).padStart(2,'0')}`;
      if(format==='us')return `${y}-${String(a).padStart(2,'0')}-${String(b).padStart(2,'0')}`;
      // Auto-detect: if first part > 12, it must be day (dd/mm)
      if(a>12)return `${y}-${String(b).padStart(2,'0')}-${String(a).padStart(2,'0')}`;
      // If second part > 12, first must be month (mm/dd)
      if(b>12)return `${y}-${String(a).padStart(2,'0')}-${String(b).padStart(2,'0')}`;
      // Ambiguous: default to US (m/d/yyyy) since timesheets are larger dataset
      return `${y}-${String(a).padStart(2,'0')}-${String(b).padStart(2,'0')}`;
    }
  }
  const d=new Date(s);
  return isNaN(d)?'':d.toISOString().slice(0,10);
}

function computeForecast(cfg,filterPoTeams){
  const poArr=cfg.po_details;
  const poByTeam={};
  poArr.forEach(po=>{
    const key=(po.PO_Team_Identifier||'').replace(/\s+/g,'');
    const endDt=parseValidityEnd(po.PO_Validity||po.PO_Validity_Year);
    if(!poByTeam[key])poByTeam[key]={PO_WO_value:0,maxEnd:new Date(0),WO_StartDate:'9999-12-31',PO_Currency_Code:po.PO_Currency_Code,Normalized_Currency_Code:po.Normalized_Currency_Code,WO_Approval_Status:po.WO_Approval_Status,PO_Team_Identifier:key,pos:[],rollover_allowed:false};
    poByTeam[key].PO_WO_value+=po.PO_WO_value;
    if(endDt>poByTeam[key].maxEnd)poByTeam[key].maxEnd=endDt;
    if(po.WO_StartDate<poByTeam[key].WO_StartDate)poByTeam[key].WO_StartDate=po.WO_StartDate;
    if(po.rollover_allowed)poByTeam[key].rollover_allowed=true;
    poByTeam[key].pos.push(po);
  });

  const normFilter=filterPoTeams&&filterPoTeams.length?filterPoTeams.map(t=>t.replace(/\s+/g,'')):null;
  const activeTeams=normFilter||Object.keys(poByTeam);
  const activePOs=activeTeams.map(t=>poByTeam[t]).filter(Boolean);

  const totalPOValue=activePOs.reduce((s,p)=>s+p.PO_WO_value,0);
  const maxEnd=activePOs.reduce((m,p)=>p.maxEnd>m?p.maxEnd:m,new Date(0));
  const earliestStart=activePOs.reduce((m,p)=>(p.WO_StartDate&&p.WO_StartDate<m)?p.WO_StartDate:m,'9999-12-31');
  const currency=activePOs[0]||{PO_Currency_Code:'GBP',Normalized_Currency_Code:'USD'};

  const poStart=new Date(earliestStart!=='9999-12-31'?earliestStart:'2025-01-01');
  const poEnd=maxEnd>new Date(0)?maxEnd:new Date('2025-12-31');
  const daily={};
  const STD_HOURS=8;

  const resources=cfg.resources.filter(r=>{
    const rTeam=(r.po_team||'').replace(/\s+/g,'');
    return normFilter?normFilter.includes(rTeam):true;
  });

  resources.forEach(r=>{
    if(!r.bill_rate)return;
    const rTeam=(r.po_team||'').replace(/\s+/g,'');
    const teamPO=poByTeam[rTeam];
    const teamEnd=teamPO?teamPO.maxEnd:poEnd;
    const rStart=new Date(Math.max(new Date(r.start),poStart));
    const rEnd=new Date(Math.min(new Date(r.end),teamEnd));
    if(rStart>rEnd||isNaN(rStart.getTime())||isNaN(rEnd.getTime()))return;
    const dailyCost=r.bill_rate*r.alloc*STD_HOURS;
    let d=new Date(rStart);
    while(d<=rEnd){
      if(isWorkingDay(d,r.location)){const k=d.toISOString().slice(0,10);daily[k]=(daily[k]||0)+dailyCost;}
      d=new Date(d.getTime()+86400000);
    }
  });

  const monthly={};
  Object.entries(daily).sort().forEach(([d,c])=>{
    const dt=new Date(d);
    const key=dt.toLocaleString('en',{month:'short'})+'-'+String(dt.getFullYear()).slice(2);
    monthly[key]=(monthly[key]||0)+c;
  });

  let remFc=totalPOValue;
  const burndown=Object.entries(monthly).map(([m,c])=>{remFc-=c;return{month:m,forecast:Math.round(c*100)/100,forecast_burn:Math.round(remFc*100)/100};});
  const total=Object.values(monthly).reduce((a,b)=>a+b,0);
  const days=Object.keys(daily).length;

  const today=new Date().toISOString().slice(0,10);
  let normPO=0;
  activePOs.forEach(p=>{
    const fxFrom=fxRateAsOf(cfg.fx_rates,p.PO_Currency_Code,today);
    const fxTo=fxRateAsOf(cfg.fx_rates,p.Normalized_Currency_Code||'USD',today);
    normPO+=(p.PO_WO_value/fxFrom)*fxTo;
  });

  // Multi-year PO rollover (only for POs with rollover_allowed=true)
  // Group POs by validity end year
  const posByYear={};
  activePOs.forEach(team=>{team.pos.forEach(po=>{
    if(normFilter&&!normFilter.includes((po.PO_Team_Identifier||'').replace(/\s+/g,'')))return;
    const endDt=parseValidityEnd(po.PO_Validity||po.PO_Validity_Year);
    const yr=endDt.getFullYear();
    if(!posByYear[yr])posByYear[yr]=[];
    posByYear[yr].push(po);
  });});
  const spendByYear={};
  Object.entries(daily).forEach(([d,c])=>{const yr=parseInt(d.slice(0,4));spendByYear[yr]=(spendByYear[yr]||0)+c;});
  const years=Object.keys(posByYear).map(Number).sort();
  const rolloverByYear={};
  let carryForward=0;
  years.forEach(yr=>{
    const yrPOs=posByYear[yr];
    const yrPOValue=yrPOs.reduce((s,p)=>s+p.PO_WO_value,0);
    const available=yrPOValue+carryForward;
    const spent=spendByYear[yr]||0;
    const unused=Math.max(0,available-spent);
    const anyRollover=yrPOs.some(p=>p.rollover_allowed);
    rolloverByYear[yr]={poValue:yrPOValue,carryIn:carryForward,available,spent:Math.round(spent*100)/100,unused:Math.round(unused*100)/100,rollover_allowed:anyRollover};
    // Only carry forward if rollover is allowed for this year's POs
    carryForward=anyRollover?unused:0;
  });

  return{monthly,burndown,total:Math.round(total*100)/100,days,rate:days?Math.round(total/days*100)/100:0,normPO:Math.round(normPO*100)/100,totalPOValue,currency:currency.PO_Currency_Code,normCurrency:currency.Normalized_Currency_Code||'USD',status:currency.WO_Approval_Status||'Approved',rolloverByYear,posByYear};
}

function buildData(){
  const cfg=loadWork();

  const allYears=[...new Set((cfg.po_details||[]).map(p=>{const e=parseValidityEnd(p.PO_Validity||p.PO_Validity_Year);return e.getFullYear();}))].sort();
  let filteredCfg=cfg;

  }
  const fc=computeForecast(filteredCfg,selectedPoTeams);
  const normFilter=selectedPoTeams.length?selectedPoTeams.map(t=>t.replace(/\s+/g,'')):null;
  const projToTeam={};
  cfg.resources.forEach(r=>{const t=(r.po_team||'').replace(/\s+/g,'');if(r.projectID&&t)projToTeam[r.projectID]=t;});
  (cfg.po_details||[]).forEach(p=>{const t=(p.PO_Team_Identifier||'').replace(/\s+/g,'');if(p.ProjectID&&t)projToTeam[p.ProjectID]=t;});

  let filteredActuals;

  }else if(cfg.raw_actuals&&cfg.raw_actuals.length){
    filteredActuals=computeActualsMonthly(cfg,normFilter,projToTeam);
  }else{
    filteredActuals=cfg.actuals_monthly||[];
  }

  const tAct=filteredActuals.reduce((s,m)=>s+(m.actuals||0),0);
  const normFilterExp=selectedPoTeams.length?selectedPoTeams.map(t=>t.replace(/\s+/g,'')):null;
  const filteredExpenses=cfg.expenses.filter(e=>{
    const t=(e.po_team||'').replace(/\s+/g,'');
    return normFilterExp?normFilterExp.includes(t):true;
  });

  const allPoTeams=[...new Set(fromPO)].sort();
  return{cfg:filteredCfg,fc,tAct:Math.round(tAct*100)/100,tExp:Math.round(tExp*100)/100,rem:Math.round((fc.totalPOValue-tAct-tExp)*100)/100,allPoTeams,actuals:filteredActuals,filteredExpenses,allYears};
}

// Compute actuals from raw timesheet data, filtered by PO_Team
function computeActualsMonthly(cfg,normFilter,projToTeam){
  if(!cfg.raw_actuals||!cfg.raw_actuals.length)return cfg.actuals_monthly||[];
  const monthly={};
  cfg.raw_actuals.forEach(row=>{
    const projId=parseInt(row['Project ID']||row.project_id||0);
    const team=projToTeam[projId]||'';
    if(normFilter&&!normFilter.includes(team))return;
    const dtRaw=row['Reported Dt']||row.reported_dt||'';
    const dt=parseDate(dtRaw,'us');if(!dt)return;
    const d=new Date(dt);if(isNaN(d.getTime()))return;
    const key=d.toLocaleString('en',{month:'short'})+'-'+String(d.getFullYear()).slice(2);
    const regHrs=parseFloat(row['Regular Hours']||0);
    const otHrs=parseFloat(row['Overtime Hours']||0);
    const emplId=parseInt(row['Empl ID']||0);
    // Find matching resource rule (effective-dated)
    const rule=cfg.resources.find(r=>r.empl_id===emplId&&r.start<=dt&&r.end>=dt)
      ||cfg.resources.find(r=>r.empl_id===emplId);
    const rate=rule?rule.bill_rate:0;
    const hourMult=rule?rule.hour_mult:1;
    const poTeam=rule?(rule.po_team||'').replace(/\s+/g,''):'';
    const otMult=otMultiplier(cfg.ot_params,poTeam,'Overtime_Hours',dt);
    const cost=(regHrs*hourMult*rate)+(otHrs*hourMult*rate*otMult);
    if(!monthly[key])monthly[key]=0;
    monthly[key]+=cost;
  });
  const poVal=(cfg.po_details||[]).reduce((s,p)=>{
    const t=(p.PO_Team_Identifier||'').replace(/\s+/g,'');
    return(normFilter&&!normFilter.includes(t))?s:s+p.PO_WO_value;
  },0);
  let cum=0;
  return Object.entries(monthly).sort((a,b)=>new Date('1 '+a[0])-new Date('1 '+b[0])).map(([m,v])=>{
    cum+=v;return{month:m,actuals:Math.round(v*100)/100,forecast:null,actuals_burn:Math.round((poVal-cum)*100)/100,forecast_burn:null};
  });
}

function rOV(D){

  const fcVsAct=D.fc.total?Math.round(D.tAct/D.fc.total*100):0;
  const daysRem=D.fc.rate>0?Math.round(D.rem/D.fc.rate):0;
  let h='';
  // Onboarding hint for new users (show if no actuals loaded)
  if(!D.cfg.raw_actuals||!D.cfg.raw_actuals.length){
    h+='<div style="padding:.8rem 1rem;background:#e3f2fd;border-radius:8px;border:1px solid #90caf9;margin-bottom:1rem;font-size:.78rem">';

  h+=`<div class="card r"><h3>Burn Rate/Day</h3><div class="v">${f(D.fc.rate)}</div></div>`;
  h+=`<div class="card b"><h3>Total Forecast</h3><div class="v">${f(D.fc.total)}</div></div>`;
  h+=`<div class="card g"><h3>Expenses</h3><div class="v">${f(D.tExp)}</div></div>`;
  h+=`<div class="card"><h3>Budget Used</h3><div class="v" style="color:${pctUsed>90?'#c62828':pctUsed>70?'#e65100':'#2e7d32'}">${pctUsed}%</div></div>`;
  h+=`<div class="card"><h3>Forecast Accuracy</h3><div class="v">${fcVsAct}%</div></div>`;

  h+=`<div class="card"><h3>Status</h3><div class="v"><span class="badge ${risk==='Low'?'badge-low':'badge-over'}">${D.fc.status} · ${risk}</span></div></div>`;

    teamBudgets[t].po+=p.PO_WO_value;
  });
  // Compute forecast per team independently from resource rules
  // Compute PO validity end per team for bounding forecast
  const teamValidityEnd={};
  (D.cfg.po_details||[]).forEach(p=>{
    const t=(p.PO_Team_Identifier||'').replace(/\s+/g,'');
    const endDt=parseValidityEnd(p.PO_Validity||p.PO_Validity_Year);
    if(!teamValidityEnd[t]||endDt>teamValidityEnd[t])teamValidityEnd[t]=endDt;
  });
  const fcPerTeam={};
  D.cfg.resources.forEach(r=>{
    if(!r.bill_rate)return;
    const t=(r.po_team||'').replace(/\s+/g,'');
    if(!fcPerTeam[t])fcPerTeam[t]=0;
    const rStart=new Date(r.start);
    const poEnd=teamValidityEnd[t]||new Date(r.end);
    const rEnd=new Date(Math.min(new Date(r.end),poEnd));
    if(isNaN(rStart)||isNaN(rEnd)||rStart>rEnd)return;
    const dailyCost=r.bill_rate*r.alloc*8;
    let d=new Date(rStart);
    while(d<=rEnd){if(isWorkingDay(d,r.location))fcPerTeam[t]+=dailyCost;d=new Date(d.getTime()+86400000);}
  });
  h+='<div class="box"><h2>PO_Team Budget Status</h2><p style="font-size:.72rem;color:#666;margin-bottom:.8rem"><strong>Fc</strong> = Forecast utilization % of PO value. Calculated as: <code>Total Forecast Cost ÷ PO Value × 100</code>. Forecast = sum of (BillRate × Allocation × 8hrs × working days) for each resource, bounded by PO validity end date. <span style="color:#2e7d32">🟢 &lt;85%</span> On Track · <span style="color:#e65100">🟠 85-100%</span> At Risk · <span style="color:#c62828">🔴 &gt;100%</span> Over Budget</p><div class="cards">';
  Object.entries(teamBudgets).forEach(([team,data])=>{
    const teamFc=fcPerTeam[team]||0;
    const overBudget=teamFc>data.po;
    const pct=data.po?Math.round(teamFc/data.po*100):0;
    const color=overBudget?'r':pct>85?'o':'g';
    const statusMsg=overBudget?`${data.status} · Over Budget`:`${data.status} · On Track`;
    h+=`<div class="card ${color}"><h3 style="font-size:.68rem">${team}</h3><div class="v" style="font-size:1rem">${f(data.po)}</div><div style="font-size:.7rem;margin-top:3px"><span class="badge ${overBudget?'badge-over':'badge-low'}">${statusMsg}</span> · Fc: ${pct}% (${f(teamFc)})</div></div>`;
  });
  h+='</div></div>';
  h+='<div class="box"><h2>Monthly: Forecast vs Actuals</h2><canvas id="c1" height="80"></canvas></div>';return h;
}
function rBD(D){
  // Build merged data for table
  const fcMap={};D.fc.burndown.forEach(m=>{fcMap[m.month]={forecast:m.forecast,forecast_burn:m.forecast_burn};});
  const actMap={};D.actuals.forEach(m=>{actMap[m.month]={actuals:m.actuals,actuals_burn:m.actuals_burn};});
  const allMonths=[...new Set([...Object.keys(fcMap),...Object.keys(actMap)])].sort((a,b)=>new Date('1 '+a)-new Date('1 '+b));

  h+='<div class="box"><h2>Normalized Burndown ('+D.fc.normCurrency+')</h2><canvas id="c2norm" height="80"></canvas></div>';
  // Table

  allMonths.forEach(m=>{
    const fc=fcMap[m]||{},ac=actMap[m]||{};
    const v=(ac.actuals!=null&&fc.forecast!=null)?Math.round((ac.actuals-fc.forecast)*100)/100:null;
    h+=`<tr><td><strong>${m}</strong></td><td>${f(fc.forecast)}</td><td>${f(ac.actuals)}</td><td>${f(fc.forecast_burn)}</td><td>${f(ac.actuals_burn)}</td><td style="${v!=null?(v>0?'color:#c62828':'color:#2e7d32'):''}">${f(v)}</td></tr>`;
  });
  h+='</tbody></table></div></div>';
  // Normalized Monthly Detail table
  const today3=new Date().toISOString().slice(0,10);

  const fxTn=fxRateAsOf(D.cfg.fx_rates,D.fc.normCurrency||'USD',today3);
  const nx=v=>v!=null?Math.round(v/fxFn*fxTn*100)/100:null;
  h+=`<div class="box"><h2>Normalized Monthly Detail (${D.fc.normCurrency})</h2><div class="tw"><table><thead><tr><th>Month</th><th>Forecast Spend</th><th>Actuals Spend</th><th>Forecast Burn</th><th>Actuals Burn</th><th>Variance</th></tr></thead><tbody>`;
  allMonths.forEach(m=>{
    const fc=fcMap[m]||{},ac=actMap[m]||{};
    const v=(ac.actuals!=null&&fc.forecast!=null)?nx(ac.actuals-fc.forecast):null;
    h+=`<tr><td><strong>${m}</strong></td><td>${f(nx(fc.forecast),'$')}</td><td>${f(nx(ac.actuals),'$')}</td><td>${f(nx(fc.forecast_burn),'$')}</td><td>${f(nx(ac.actuals_burn),'$')}</td><td style="${v!=null?(v>0?'color:#c62828':'color:#2e7d32'):''}">${f(v,'$')}</td></tr>`;
  });
  h+='</tbody></table></div></div>';
  return h;
}

// ─── RESOURCE UTILIZATION ────────────────────────────────────────────────────
function rUtil(D){
  const cfg=D.cfg;
  const validTeams=new Set((cfg.po_details||[]).map(p=>(p.PO_Team_Identifier||'').replace(/\s+/g,'')));
  const normFilter=selectedPoTeams.length?selectedPoTeams.map(t=>t.replace(/\s+/g,'')):null;
  const fullCfg=loadWork();
  const resources=(fullCfg.resources||[]).filter(r=>{
    const t=(r.po_team||'').replace(/\s+/g,'');
    if(!validTeams.has(t))return false;
    return normFilter?normFilter.includes(t):true;
  });
  // Group by person
  const byPerson={};
  resources.forEach(r=>{
    const key=r.empl_id+'|'+r.name;
    if(!byPerson[key])byPerson[key]={name:r.name,empl_id:r.empl_id,rules:[],totalAvail:0,totalActual:0};
    byPerson[key].rules.push(r);
  });
  Object.values(byPerson).forEach(p=>{
    p.rules.forEach(r=>{
      const s=new Date(r.start),e=new Date(r.end);
      if(isNaN(s)||isNaN(e))return;
      let d=new Date(s);
      while(d<=e){if(isWorkingDay(d,r.location))p.totalAvail+=8*r.alloc;d=new Date(d.getTime()+86400000);}
    });
  });
  // Compute actual hours + per-project coverage (UNFILTERED for date range table)
  const projCoverage={};
  const allProjToTeam={};
  (fullCfg.resources||[]).forEach(r=>{const t=(r.po_team||'').replace(/\s+/g,'');if(r.projectID&&t)allProjToTeam[r.projectID]=t;});
  (fullCfg.po_details||[]).forEach(p=>{const t=(p.PO_Team_Identifier||'').replace(/\s+/g,'');if(p.ProjectID&&t)allProjToTeam[p.ProjectID]=t;});
  if(fullCfg.raw_actuals&&fullCfg.raw_actuals.length){
    fullCfg.raw_actuals.forEach(row=>{
      const eid=parseInt(row['Empl ID']||0);
      const key=Object.keys(byPerson).find(k=>k.startsWith(eid+'|'));
      const dt=parseDate(row['Reported Dt']||'','us');
      const projId=row['Project ID']||'';
      const team=allProjToTeam[parseInt(projId)]||'';
      if(dt&&projId){
        if(!projCoverage[projId])projCoverage[projId]={min:dt,max:dt,team,rows:0};
        if(dt<projCoverage[projId].min)projCoverage[projId].min=dt;
        if(dt>projCoverage[projId].max)projCoverage[projId].max=dt;
        projCoverage[projId].rows++;
      }
      if(!key)return;
      const reg=parseFloat(row['Regular Hours']||0);
      const ot=parseFloat(row['Overtime Hours']||0);
      const rule=byPerson[key].rules[0];
      const hm=rule?rule.hour_mult:1;
      byPerson[key].totalActual+=(reg+ot)*(hm===8?8:1);
      if(dt){
        if(!byPerson[key].minDt||dt<byPerson[key].minDt)byPerson[key].minDt=dt;
        if(!byPerson[key].maxDt||dt>byPerson[key].maxDt)byPerson[key].maxDt=dt;
      }
    });
  }
  const people=Object.values(byPerson);
  const overUtil=people.filter(p=>p.totalAvail>0&&p.totalActual>p.totalAvail);
  const underUtil=people.filter(p=>p.totalAvail>0&&p.totalActual>0&&p.totalActual<p.totalAvail*0.7);
  const noData=people.filter(p=>p.totalActual===0);
  let h='<div class="cards">';
  h+=`<div class="card b"><h3>People</h3><div class="v">${people.length}</div></div>`;
  h+=`<div class="card g"><h3>Total Available Hrs</h3><div class="v">${Math.round(people.reduce((s,p)=>s+p.totalAvail,0)).toLocaleString()}</div></div>`;
  h+=`<div class="card o"><h3>Total Actual Hrs</h3><div class="v">${Math.round(people.reduce((s,p)=>s+p.totalActual,0)).toLocaleString()}</div></div>`;
  h+=`<div class="card r"><h3>Over-utilized</h3><div class="v">${overUtil.length}</div></div>`;
  h+=`<div class="card" style="border-left-color:#ff9800"><h3>Under-utilized (&lt;70%)</h3><div class="v">${underUtil.length}</div></div>`;

function saveScenario(){
  const name=document.getElementById('scenName').value.trim();
  if(!name){toast('Enter a scenario name',false);return;}
  const cfg=loadWork();
  const fc=computeForecast(cfg,[]);
  cfg._forecast=fc.total;
  cfg._saved=new Date().toISOString().slice(0,16);
  const scenarios=JSON.parse(localStorage.getItem('pf_scenarios')||'{}');
  scenarios[name]=cfg;
  localStorage.setItem('pf_scenarios',JSON.stringify(scenarios));
  toast('✓ Scenario "'+name+'" saved');
  render();
}
function loadScenario(name){
  const scenarios=JSON.parse(localStorage.getItem('pf_scenarios')||'{}');
  if(!scenarios[name])return;
  const cfg=scenarios[name];
  delete cfg._forecast;delete cfg._saved;
  saveWork(cfg);
  toast('✓ Loaded scenario "'+name+'"');
  render();
}
function deleteScenario(name){
  const scenarios=JSON.parse(localStorage.getItem('pf_scenarios')||'{}');
  delete scenarios[name];
  localStorage.setItem('pf_scenarios',JSON.stringify(scenarios));
  toast('✓ Deleted "'+name+'"');
  render();
}
function compareScenarios(){
  const aName=document.getElementById('scenA').value;
  const bName=document.getElementById('scenB').value;
  const scenarios=JSON.parse(localStorage.getItem('pf_scenarios')||'{}');
  const cfgA=aName==='_current'?loadWork():scenarios[aName];
  const cfgB=scenarios[bName];
  if(!cfgA||!cfgB){toast('Select two valid scenarios',false);return;}
  const fcA=computeForecast(cfgA,[]);
  const fcB=computeForecast(cfgB,[]);
  const resA=cfgA.resources||[],resB=cfgB.resources||[];
  let h='<table><thead><tr><th>Metric</th><th>'+(aName==='_current'?'Current':aName)+'</th><th>'+bName+'</th><th>Difference</th></tr></thead><tbody>';
  const rows=[
    ['Resources',resA.length,resB.length],
    ['People',[...new Set(resA.map(r=>r.name))].length,[...new Set(resB.map(r=>r.name))].length],
    ['Total Forecast',fcA.total,fcB.total],
    ['PO Value',fcA.totalPOValue,fcB.totalPOValue],
    ['Burn Rate/Day',fcA.rate,fcB.rate],
    ['Forecast Days',fcA.days,fcB.days],
  ];
  rows.forEach(([label,a,b])=>{
    const diff=typeof a==='number'?a-b:0;
    const diffStr=typeof a==='number'?(diff>0?'+':'')+f(diff):'—';
    const color=diff>0?'color:#c62828':diff<0?'color:#2e7d32':'';
    h+=`<tr><td><strong>${label}</strong></td><td>${typeof a==='number'?f(a):a}</td><td>${typeof b==='number'?f(b):b}</td><td style="${color};font-weight:600">${diffStr}</td></tr>`;
  });
  h+='</tbody></table>';
  // Resource diff
  const namesA=new Set(resA.map(r=>r.name)),namesB=new Set(resB.map(r=>r.name));
  const added=[...namesB].filter(n=>!namesA.has(n));
  const removed=[...namesA].filter(n=>!namesB.has(n));
  if(added.length||removed.length){
    h+='<div style="margin-top:.8rem;font-size:.78rem">';
    if(added.length)h+=`<p style="color:#2e7d32">➕ In ${bName} only: ${added.join(', ')}</p>`;
    if(removed.length)h+=`<p style="color:#c62828">➖ In ${aName==='_current'?'Current':aName} only: ${removed.join(', ')}</p>`;
    h+='</div>';
  }
  document.getElementById('scenCompare').innerHTML=h;
}

function rActData(D){
  const cfg=D.cfg;
  const fullCfg=loadWork();
  const rawCount=fullCfg.raw_actuals?fullCfg.raw_actuals.length:0;
  const normFilter=selectedPoTeams.length?selectedPoTeams.map(t=>t.replace(/\s+/g,'')):null;
  const validTeamsAct=new Set((cfg.po_details||[]).map(p=>(p.PO_Team_Identifier||'').replace(/\s+/g,'')));
  // Build projToTeam from full config
  const projToTeam={};
  (fullCfg.resources||[]).forEach(r=>{const t=(r.po_team||'').replace(/\s+/g,'');if(r.projectID&&t)projToTeam[r.projectID]=t;});
  (fullCfg.po_details||[]).forEach(p=>{const t=(p.PO_Team_Identifier||'').replace(/\s+/g,'');if(p.ProjectID&&t)projToTeam[p.ProjectID]=t;});

  // Filter raw actuals by year-valid teams AND PO_Team slicer
  const filtered=(fullCfg.raw_actuals||[]).filter(row=>{
    const projId=parseInt(row['Project ID']||0);
    const team=projToTeam[projId]||'';
    if(!validTeamsAct.has(team))return false;
    return normFilter?normFilter.includes(team):true;
  });

  // Compute date ranges per project (UNFILTERED - all raw actuals)
  const projDates={};
  (fullCfg.raw_actuals||[]).forEach(row=>{
    const projId=row['Project ID']||'';
    const dt=parseDate(row['Reported Dt']||'','us');if(!dt)return;
    if(!projDates[projId])projDates[projId]={min:dt,max:dt,count:0,team:projToTeam[parseInt(projId)]||''};
    if(dt<projDates[projId].min)projDates[projId].min=dt;
    if(dt>projDates[projId].max)projDates[projId].max=dt;
    projDates[projId].count++;
  });

  // Show metrics

    h+='</tbody></table></div></div>';

  // Show monthly actuals breakdown (collapsible)
  h+='<div class="box">';
  h+='<div class="collapsible-hdr" onclick="this.classList.toggle(\'collapsed\');this.nextElementSibling.classList.toggle(\'hidden\')">📈 Monthly Actuals (Filtered by Slicer)</div>';
  h+='<div class="collapsible-body">';

  const monthBuckets={};
  filtered.forEach(row=>{
    const dt=parseDate(row['Reported Dt']||'','us');if(!dt)return;
    const d=new Date(dt);const key=d.toLocaleString('en',{month:'short'})+'-'+String(d.getFullYear()).slice(2);
    if(!monthBuckets[key])monthBuckets[key]={cost:0,rows:0};
    const eid=parseInt(row['Empl ID']||0);
    const rule=cfg.resources.find(r=>r.empl_id===eid&&r.start<=dt&&r.end>=dt)||cfg.resources.find(r=>r.empl_id===eid);
    const rate=rule?rule.bill_rate:0;const hm=rule?rule.hour_mult:1;
    const reg=parseFloat(row['Regular Hours']||0);const ot=parseFloat(row['Overtime Hours']||0);
    monthBuckets[key].cost+=(reg*hm*rate)+(ot*hm*rate);
    monthBuckets[key].rows++;
  });
  Object.entries(monthBuckets).sort((a,b)=>new Date('1 '+a[0])-new Date('1 '+b[0])).forEach(([m,v])=>{
    cum+=v.cost;
    h+=`<tr><td><strong>${m}</strong></td><td>${f(v.cost)}</td><td>${v.rows}</td><td>${f(poVal-cum)}</td></tr>`;
  });
  h+='</tbody></table></div></div></div>';

  // Show first 20 raw rows
  if(filtered.length){
    h+='<div class="box"><h2>Sample Raw Data (first 20 filtered rows)</h2><div class="tw"><table><thead><tr><th>Name</th><th>Empl ID</th><th>Date</th><th>Project</th><th>Reg Hrs</th><th>OT Hrs</th><th>Matched Rate</th><th>Cost</th></tr></thead><tbody>';
    filtered.slice(0,20).forEach(row=>{
      const eid=parseInt(row['Empl ID']||0);
      const dt=parseDate(row['Reported Dt']||'','us');
      const rule=cfg.resources.find(r=>r.empl_id===eid&&r.start<=dt&&r.end>=dt)||cfg.resources.find(r=>r.empl_id===eid);
      const rate=rule?rule.bill_rate:0;const hm=rule?rule.hour_mult:1;
      const reg=parseFloat(row['Regular Hours']||0);const ot=parseFloat(row['Overtime Hours']||0);
      const cost=(reg*hm*rate)+(ot*hm*rate);
      h+=`<tr><td>${row['Empl Name']||''}</td><td>${eid}</td><td>${dt}</td><td>${row['Project ID']||''}</td><td>${reg}</td><td>${ot}</td><td>£${rate}×${hm}</td><td>${f(cost)}</td></tr>`;
    });
    h+='</tbody></table></div></div>';
  }
  return h;
}

// ─── PO DETAILS TAB ─────────────────────────────────────────────────────────
function rPO(D){
  const normFilterPO=selectedPoTeams.length?selectedPoTeams.map(t=>t.replace(/\s+/g,'')):null;
  const pos=(D.cfg.po_details||[]).filter(p=>normFilterPO?normFilterPO.includes((p.PO_Team_Identifier||'').replace(/\s+/g,'')):true);
  const byTeam={};
  pos.forEach(p=>{
    const k=(p.PO_Team_Identifier||'').replace(/\s+/g,'');
    const endDt=parseValidityEnd(p.PO_Validity||p.PO_Validity_Year);
    if(!byTeam[k])byTeam[k]={value:0,maxEnd:new Date(0),minStart:'9999',currency:p.PO_Currency_Code,normCurrency:p.Normalized_Currency_Code,count:0,pos:[],rollover:false};
    byTeam[k].value+=p.PO_WO_value;
    if(endDt>byTeam[k].maxEnd)byTeam[k].maxEnd=endDt;
    if(p.WO_StartDate<byTeam[k].minStart)byTeam[k].minStart=p.WO_StartDate;
    if(p.rollover_allowed)byTeam[k].rollover=true;
    byTeam[k].count++;byTeam[k].pos.push(p);
  });
  const totalPO=pos.reduce((s,p)=>s+p.PO_WO_value,0);
  const today=new Date().toISOString().slice(0,10);
  const normTotal=Object.values(byTeam).reduce((s,t)=>{
    const fxFrom=fxRateAsOf(D.cfg.fx_rates,t.currency,today);
    const fxTo=fxRateAsOf(D.cfg.fx_rates,t.normCurrency,today);
    return s+(t.value/fxFrom*fxTo);
  },0);

  let h='<div class="cards">';
  h+=`<div class="card b"><h3>Total POs</h3><div class="v">${pos.length}</div></div>`;
  h+=`<div class="card g"><h3>Unique Projects</h3><div class="v">${Object.keys(byTeam).length}</div></div>`;
  h+=`<div class="card o"><h3>Total PO Value</h3><div class="v">${f(totalPO)}</div></div>`;
  h+=`<div class="card p"><h3>Normalized Total</h3><div class="v">${f(normTotal,'$')}</div></div>`;
  h+='</div>';

  // Timeline view of POs
  const allStarts=pos.map(p=>new Date(p.WO_StartDate)).filter(d=>!isNaN(d));
  const allEnds=pos.map(p=>parseValidityEnd(p.PO_Validity||p.PO_Validity_Year));
  const tStart=allStarts.length?new Date(Math.min(...allStarts)):new Date('2024-01-01');
  const tEnd=allEnds.length?new Date(Math.max(...allEnds)):new Date('2027-12-31');
  const span=tEnd-tStart||1;
  const colors=['#5c6bc0','#26a69a','#e65100','#8e24aa','#2e7d32','#c62828'];
  h+='<div class="box"><h2>PO & Invoice Timeline</h2><div class="tl-scroll"><div class="tl-inner">';
  h+='<div style="margin-left:200px;position:relative;height:18px;font-size:.6rem;color:#888;margin-bottom:4px">';
  let md=new Date(tStart.getFullYear(),0,1);
  while(md<=tEnd){const l=((md-tStart)/span*100);if(l>=0&&l<=100)h+=`<span style="position:absolute;left:${l.toFixed(1)}%">${md.getFullYear()}</span>`;md=new Date(md.getFullYear()+1,0,1);}
  h+='</div>';
  const invAll=D.cfg.invoices||[];
  const statusColor={'Paid':'#4caf50','Submitted':'#ff9800','Draft':'#bdbdbd'};
  Object.entries(byTeam).forEach(([team,data],i)=>{
    const rs=new Date(data.minStart),re=data.maxEnd;
    const left=Math.max(0,(rs-tStart)/span*100).toFixed(1);
    const width=Math.max(2,(re-rs)/span*100).toFixed(1);
    h+=`<div class="tl-row"><span class="nm" style="min-width:200px;font-size:.68rem">${team}</span><div class="ba"><div class="br" style="left:${left}%;width:${width}%;background:${colors[i%colors.length]}">${f(data.value)} (${data.count} POs)${data.rollover?' 🔄':''}</div></div></div>`;
    const teamInvs=invAll.filter(inv=>(inv.po_team||'').replace(/\s+/g,'')===team);
    if(teamInvs.length){
      h+=`<div class="tl-row"><span class="nm" style="min-width:200px;font-size:.6rem;color:#888">└ Invoices</span><div class="ba" style="height:16px">`;
      teamInvs.forEach(inv=>{
        const is=new Date(inv.period_from),ie=new Date(inv.period_to);
        if(isNaN(is)||isNaN(ie))return;
        const il=Math.max(0,(is-tStart)/span*100).toFixed(1);
        const iw=Math.max(1,(ie-is)/span*100).toFixed(1);
        h+=`<div class="br" style="left:${il}%;width:${iw}%;background:${statusColor[inv.status]||'#666'};height:16px;font-size:.55rem">${f(inv.amount)}</div>`;
      });
      h+=`</div></div>`;
    }
  });
  h+='<div style="margin-top:6px;font-size:.68rem">🟢 Paid &nbsp; 🟠 Submitted &nbsp; ⚪ Draft &nbsp; 🔄 Rollover Allowed</div></div></div></div>';

  // Invoice coverage
  const invs=D.cfg.invoices||[];
  if(invs.length){
    h+='<div class="box"><h2>Invoice Coverage</h2><div class="tw"><table><thead><tr><th>PO_Team</th><th>PO Value</th><th>Invoiced</th><th>Paid</th><th>Coverage %</th><th>Remaining</th></tr></thead><tbody>';
    Object.entries(byTeam).forEach(([team,data])=>{
      const teamInvs=invs.filter(i=>(i.po_team||'').replace(/\s+/g,'')===team);
      const invoiced=teamInvs.reduce((s,i)=>s+i.amount,0);
      const paid=teamInvs.filter(i=>i.status==='Paid').reduce((s,i)=>s+i.amount,0);
      const pct=data.value?Math.round(invoiced/data.value*100):0;
      h+=`<tr><td style="font-size:.68rem">${team}</td><td>${f(data.value)}</td><td>${f(invoiced)}</td><td>${f(paid)}</td><td style="font-weight:600;color:${pct>90?'#c62828':pct>70?'#e65100':'#2e7d32'}">${pct}%</td><td>${f(data.value-invoiced)}</td></tr>`;
    });
    h+='</tbody></table></div></div>';
  }

  // Multi-year rollover summary
  if(D.fc.rolloverByYear&&Object.keys(D.fc.rolloverByYear).length>0){
    h+='<div class="box"><h2>📅 Multi-Year PO Rollover</h2><p style="font-size:.75rem;color:#666;margin-bottom:.5rem">Unused budget carries forward only when <code>rollover_allowed=true</code>.</p><div class="tw"><table><thead><tr><th>Year</th><th>PO Value</th><th>Carry-In</th><th>Available</th><th>Forecast Spend</th><th>Unused</th><th>Rollover?</th></tr></thead><tbody>';
    Object.entries(D.fc.rolloverByYear).sort((a,b)=>a[0]-b[0]).forEach(([yr,d])=>{
      h+=`<tr><td><strong>${yr}</strong></td><td>${f(d.poValue)}</td><td style="color:#2196f3;font-weight:600">${f(d.carryIn)}</td><td style="font-weight:600">${f(d.available)}</td><td>${f(d.spent)}</td><td style="color:${d.unused>0?'#4caf50':'#c62828'};font-weight:600">${f(d.unused)}</td><td>${d.rollover_allowed?'✅ Yes':'❌ No'}</td></tr>`;
    });
    h+='</tbody></table></div></div>';
  }

  // Detail table
  h+='<div class="box"><h2>All PO Entries</h2><div class="tw"><table id="tblPO"><thead><tr><th data-sort="0" style="cursor:pointer">PO_Team ⇅</th><th data-sort="1" style="cursor:pointer">ProjectID ⇅</th><th data-sort="2" style="cursor:pointer">PO Value ⇅</th><th>Currency</th><th>Norm Currency</th><th data-sort="5" style="cursor:pointer">Start ⇅</th><th data-sort="6" style="cursor:pointer">Validity ⇅</th><th>Rollover</th><th>Status</th><th>PO Number</th></tr></thead><tbody>';
  pos.forEach(p=>{
    h+=`<tr><td style="font-size:.68rem">${p.PO_Team_Identifier}</td><td>${p.ProjectID}</td><td>${f(p.PO_WO_value)}</td><td>${p.PO_Currency_Code}</td><td>${p.Normalized_Currency_Code}</td><td>${p.WO_StartDate}</td><td>${fmtValidity(p.PO_Validity||p.PO_Validity_Year)}</td><td>${p.rollover_allowed?'✅':'❌'}</td><td>${p.WO_Approval_Status}</td><td>${p.PO_WO_Number}</td></tr>`;
  });
  h+='</tbody></table></div></div>';
  return h;
}

function handleUpload(input,type){
  const file=input.files[0];if(!file)return;
  const ext=file.name.split('.').pop().toLowerCase();
  if(ext==='xlsx'||ext==='xls'){
    file.arrayBuffer().then(buf=>{const wb=XLSX.read(buf);const ws=wb.Sheets[wb.SheetNames[0]];const data=XLSX.utils.sheet_to_json(ws);processUpload(data,type);});return;
  }
  const reader=new FileReader();
  reader.onload=function(e){
    const text=e.target.result;
    let data;
    if(file.name.endsWith('.json')){
      try{data=JSON.parse(text);}catch(err){toast('✗ Invalid JSON: '+err.message,false);return;}
    }else{
      // Parse CSV
      const lines=text.trim().split('\n');
      const headers=lines[0].split(',').map(h=>h.trim().replace(/"/g,''));
      data=lines.slice(1).map(line=>{
        const vals=line.split(',').map(v=>v.trim().replace(/"/g,''));
        const obj={};headers.forEach((h,i)=>{obj[h]=vals[i]||'';});return obj;
      });
    }
    processUpload(data,type);
  };
  reader.readAsText(file);
}
function processUpload(data,type){
    if(type==='resources'){
      // Validate upload
      const uploadErrs=[];
      if(!data.length){uploadErrs.push('File is empty');}
      const sample=data[0]||{};
      const hasName=sample.name||sample['Empl Name']||sample.EmplName;
      const hasStart=sample.start||sample.RateEffectiveDt;
      const hasEnd=sample.end||sample.ContractEndDt;
      if(!hasName)uploadErrs.push('Missing name/Empl Name column');
      if(!hasStart)uploadErrs.push('Missing start/RateEffectiveDt column');
      if(!hasEnd)uploadErrs.push('Missing end/ContractEndDt column');
      // Row-level validation
      const rowErrs=[];
      data.forEach((r,i)=>{
        const rate=parseFloat(r.bill_rate||r.BillRate||0);
        const alloc=parseFloat(r.alloc||r.Allocation_Percentage||1);
        const startRaw=r.start||r.RateEffectiveDt||'';
        const endRaw=r.end||r.ContractEndDt||'';
        if(rate<0)rowErrs.push(`Row ${i+2}: negative bill_rate (${rate})`);
        if(alloc<0||alloc>1)rowErrs.push(`Row ${i+2}: alloc ${alloc} outside 0-1 range`);
        if(startRaw&&endRaw){const s=parseDate(startRaw,'uk'),e=parseDate(endRaw,'uk');if(s&&e&&s>e)rowErrs.push(`Row ${i+2}: start (${s}) > end (${e})`);}
        if(!parseInt(r.empl_id||r['Empl ID']||r.EmplID||0))rowErrs.push(`Row ${i+2}: missing/invalid empl_id`);
        if(!(r.po_team||r.PO_Team_Identifier||'').trim())rowErrs.push(`Row ${i+2}: missing po_team`);
      });
      if(rowErrs.length>10)uploadErrs.push(...rowErrs.slice(0,10),`...and ${rowErrs.length-10} more row errors`);
      else uploadErrs.push(...rowErrs);
      if(uploadErrs.length){toast('✗ Upload validation failed: '+uploadErrs.slice(0,3).join('; '),false);document.getElementById('uploadPreview').innerHTML='<div class="val-err"><strong>⚠️ Upload Errors ('+uploadErrs.length+'):</strong><ul>'+uploadErrs.map(e=>'<li>'+e+'</li>').join('')+'</ul></div>';return;}
      // Normalize resource data
      const resources=data.map(r=>{
        const startRaw=r.start||r.RateEffectiveDt||'';
        const endRaw=r.end||r.ContractEndDt||'';
        return{
          name:r.name||r['Empl Name']||'',empl_id:parseInt(r.empl_id||r['Empl ID']||r.EmplID)||0,
          role:r.role||r.Role||'',location:r.location||r.Location||'UK',
          start:parseDate(startRaw,'uk'),end:parseDate(endRaw,'uk'),
          bill_rate:parseFloat(r.bill_rate||r.BillRate)||0,
          hour_mult:parseFloat(r.hour_mult||r.HourMultiplier_TimeEntry||r.Hour_Multiplier)||1,
          alloc:parseFloat(r.alloc||r.Allocation_Percentage)||1,
          projectID:parseInt(r.projectID||r.ProjectID)||0,
          po_team:(r.po_team||r.PO_Team_Identifier||'').replace(/\s+/g,'')
        };
      }).filter(r=>r.start&&r.end);
      const cfg=loadWork();
      // Cross-check: detect resources that duplicate existing PO team assignments
      const existingPOs=new Set((cfg.po_details||[]).map(p=>(p.PO_Team_Identifier||'').replace(/\s+/g,'')));
      const orphanTeams=new Set(resources.map(r=>r.po_team).filter(t=>t&&!existingPOs.has(t)));
      if(cfg.resources.length&&!confirm('⚠️ This will replace '+cfg.resources.length+' existing resource rules with '+resources.length+' new ones. Continue?'))return;
      cfg.resources=resources;saveWork(cfg);
      // Validation warnings
      const warnings=[];
      const poTeams=new Set((cfg.po_details||[]).map(p=>(p.PO_Team_Identifier||'').replace(/\s+/g,'')));
      const unmatchedTeams=new Set(resources.map(r=>r.po_team).filter(t=>!poTeams.has(t)));
      if(unmatchedTeams.size)warnings.push(unmatchedTeams.size+' resource PO_Teams not in PO_Details: '+[...unmatchedTeams].slice(0,3).join(', '));
      if(orphanTeams.size)warnings.push(orphanTeams.size+' resource PO_Teams not found in PO Details: '+[...orphanTeams].slice(0,3).join(', '));
      const invalidDates=resources.filter(r=>r.start>r.end);
      if(invalidDates.length)warnings.push(invalidDates.length+' resources have start > end date');
      const zeroRate=resources.filter(r=>r.bill_rate===0);
      if(zeroRate.length)warnings.push(zeroRate.length+' resources with zero rate (excluded from forecast)');
      // Duplicate detection
      const dupeMap={};
      resources.forEach(r=>{const k=`${r.empl_id}|${r.po_team}|${r.start}|${r.end}`;dupeMap[k]=(dupeMap[k]||0)+1;});
      const dupes=Object.entries(dupeMap).filter(([,c])=>c>1);
      if(dupes.length)warnings.push(dupes.length+' duplicate resource rules detected');
      toast(`✓ ${resources.length} resources uploaded`+(warnings.length?' ⚠️ '+warnings.join('; '):''));
      // Show quality report
      const cols=Object.keys(data[0]||{});
      const mapped={'name':'name/Empl Name','empl_id':'empl_id/Empl ID','start':'start/RateEffectiveDt','end':'end/ContractEndDt','bill_rate':'bill_rate/BillRate','alloc':'alloc/Allocation_Percentage','po_team':'po_team/PO_Team_Identifier'};
      let rpt='<div class="box"><h2>📋 Upload Report</h2>';
      rpt+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">';
      rpt+='<div><h3 style="font-size:.8rem;margin-bottom:.3rem">Column Mapping</h3><table style="font-size:.7rem"><tbody>';
      Object.entries(mapped).forEach(([field,src])=>{const found=cols.find(c=>src.split('/').some(s=>c.toLowerCase().includes(s.toLowerCase())));rpt+=`<tr><td style="font-weight:600">${field}</td><td>${found?'✅ '+found:'❌ not found'}</td></tr>`;});
      rpt+='</tbody></table></div>';
      rpt+=`<div><h3 style="font-size:.8rem;margin-bottom:.3rem">Data Quality</h3><ul style="font-size:.72rem;margin-left:1rem"><li>Total rows: ${data.length}</li><li>Valid resources: ${resources.length}</li><li>Unique people: ${[...new Set(resources.map(r=>r.name))].length}</li><li>Date range: ${resources.length?resources.reduce((m,r)=>r.start<m?r.start:m,resources[0].start):'-'} → ${resources.length?resources.reduce((m,r)=>r.end>m?r.end:m,resources[0].end):'-'}</li><li>Duplicates: ${dupes.length}</li></ul>`;
      if(warnings.length)rpt+='<div class="val-err" style="margin-top:.5rem"><ul>'+warnings.map(w=>'<li>'+w+'</li>').join('')+'</ul></div>';
      rpt+='</div></div></div>';
      document.getElementById('uploadPreview').innerHTML=rpt;
      setTimeout(render,400);
    }else if(type==='actuals'){
      // Validate actuals upload
      const uploadErrs=[];
      if(!data.length){uploadErrs.push('File is empty');}
      const sample=data[0]||{};
      if(!sample['Empl ID']&&!sample.empl_id)uploadErrs.push('Missing "Empl ID" column');
      if(!sample['Reported Dt']&&!sample.reported_dt)uploadErrs.push('Missing "Reported Dt" column');
      if(!sample['Regular Hours']&&sample['Regular Hours']!=='0')uploadErrs.push('Missing "Regular Hours" column');
      // Row-level validation
      const rowErrs=[];
      data.forEach((r,i)=>{
        const emplId=r['Empl ID']||r.empl_id||'';
        const dt=r['Reported Dt']||r.reported_dt||'';
        const regHrs=parseFloat(r['Regular Hours']||0);
        const otHrs=parseFloat(r['Overtime Hours']||0);
        if(!emplId)rowErrs.push(`Row ${i+2}: missing Empl ID`);
        if(!dt)rowErrs.push(`Row ${i+2}: missing Reported Dt`);
        else if(!parseDate(dt,'us'))rowErrs.push(`Row ${i+2}: invalid date "${dt}"`);
        if(regHrs<0)rowErrs.push(`Row ${i+2}: negative Regular Hours (${regHrs})`);
        if(otHrs<0)rowErrs.push(`Row ${i+2}: negative Overtime Hours (${otHrs})`);
        if(regHrs>24)rowErrs.push(`Row ${i+2}: Regular Hours > 24 (${regHrs})`);
      });
      if(rowErrs.length>10)uploadErrs.push(...rowErrs.slice(0,10),`...and ${rowErrs.length-10} more row errors`);
      else uploadErrs.push(...rowErrs);
      if(uploadErrs.length){toast('✗ Upload validation failed: '+uploadErrs.slice(0,3).join('; '),false);document.getElementById('uploadPreview').innerHTML='<div class="val-err"><strong>⚠️ Upload Errors ('+uploadErrs.length+'):</strong><ul>'+uploadErrs.map(e=>'<li>'+e+'</li>').join('')+'</ul></div>';return;}
      // Duplicate detection for actuals
      const actDupeMap={};
      data.forEach(row=>{const k=`${row['Empl ID']||''}|${row['Reported Dt']||''}|${row['Project ID']||''}`;actDupeMap[k]=(actDupeMap[k]||0)+1;});
      const actDupes=Object.values(actDupeMap).filter(c=>c>1).length;
      if(actDupes&&!confirm('⚠️ '+actDupes+' duplicate timesheet entries detected (same employee+date+project). Import anyway?'))return;
      // Store raw actuals for processing
      const cfg=loadWork();
      if((cfg.raw_actuals||[]).length&&!confirm('⚠️ This will replace '+(cfg.raw_actuals||[]).length+' existing timesheet rows with '+data.length+' new ones. Continue?'))return;
      cfg.raw_actuals=data;saveWork(cfg);
      aggregateActuals(data);
      // Quality report for actuals
      const cols=Object.keys(sample);
      const dateRange=data.map(r=>parseDate(r['Reported Dt']||'','us')).filter(Boolean).sort();
      let rpt='<div class="box"><h2>📋 Upload Report</h2>';
      rpt+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">';
      rpt+='<div><h3 style="font-size:.8rem;margin-bottom:.3rem">Columns Detected</h3><ul style="font-size:.72rem;margin-left:1rem">';
      cols.forEach(c=>{rpt+=`<li>✅ ${c}</li>`;});
      rpt+='</ul></div>';
      rpt+=`<div><h3 style="font-size:.8rem;margin-bottom:.3rem">Data Quality</h3><ul style="font-size:.72rem;margin-left:1rem"><li>Total rows: ${data.length}</li><li>Unique employees: ${new Set(data.map(r=>r['Empl ID'])).size}</li><li>Date range: ${dateRange[0]||'?'} → ${dateRange[dateRange.length-1]||'?'}</li><li>Duplicate rows: ${actDupes}</li><li>Projects: ${new Set(data.map(r=>r['Project ID'])).size}</li></ul>`;
      if(actDupes)rpt+=`<div class="val-err" style="margin-top:.5rem">⚠️ ${actDupes} duplicate timesheet entries detected (same employee+date+project)</div>`;
      rpt+='</div></div></div>';
      document.getElementById('uploadPreview').innerHTML=rpt;
    }
}

function aggregateActuals(data){
  const cfg=loadWork();
  cfg.raw_actuals=data;
  // Pre-compute actuals PER PROJECT for fast slicer filtering
  const projToTeam={};
  cfg.resources.forEach(r=>{const t=(r.po_team||'').replace(/\s+/g,'');if(r.projectID&&t)projToTeam[r.projectID]=t;});
  (cfg.po_details||[]).forEach(p=>{const t=(p.PO_Team_Identifier||'').replace(/\s+/g,'');if(p.ProjectID&&t)projToTeam[p.ProjectID]=t;});

  const byProject={};// {projectID: {month: cost}}
  let matched=0,unmatched=0;
  data.forEach(row=>{
    const dtRaw=row['Reported Dt']||'';
    const dt=parseDate(dtRaw,'us');if(!dt)return;
    const d=new Date(dt);if(isNaN(d.getTime()))return;
    const key=d.toLocaleString('en',{month:'short'})+'-'+String(d.getFullYear()).slice(2);
    const emplId=parseInt(row['Empl ID']||0);
    const projId=parseInt(row['Project ID']||0);
    const rule=cfg.resources.find(r=>r.empl_id===emplId&&r.start<=dt&&r.end>=dt)||cfg.resources.find(r=>r.empl_id===emplId);
    if(rule)matched++;else{unmatched++;return;}
    const rate=rule.bill_rate;const hm=rule.hour_mult;
    const poTeam=(rule.po_team||'').replace(/\s+/g,'');
    const otMult=otMultiplier(cfg.ot_params,poTeam,'Overtime_Hours',dt);
    const reg=parseFloat(row['Regular Hours']||0);
    const ot=parseFloat(row['Overtime Hours']||0);
    const cost=(reg*hm*rate)+(ot*hm*rate*otMult);
    if(!byProject[projId])byProject[projId]={};
    byProject[projId][key]=(byProject[projId][key]||0)+cost;
  });
  cfg.actuals_by_project=byProject;
  cfg.actuals_monthly=computeActualsFromCache(cfg,null,projToTeam);
  saveWork(cfg);
  toast(`✓ ${data.length} rows: ${matched} matched, ${unmatched} unmatched → ${Object.keys(byProject).length} projects`);
  setTimeout(render,400);
}

// Fast actuals from pre-computed cache (no re-parsing raw data)
function computeActualsFromCache(cfg,normFilter,projToTeam){
  const byProject=cfg.actuals_by_project||{};
  const monthly={};
  Object.entries(byProject).forEach(([projId,months])=>{
    const team=projToTeam[parseInt(projId)]||'';
    if(normFilter&&!normFilter.includes(team))return;
    Object.entries(months).forEach(([m,cost])=>{monthly[m]=(monthly[m]||0)+cost;});
  });
  const poVal=(cfg.po_details||[]).reduce((s,p)=>{
    const t=(p.PO_Team_Identifier||'').replace(/\s+/g,'');
    return(normFilter&&!normFilter.includes(t))?s:s+p.PO_WO_value;
  },0);
  let cum=0;
  return Object.entries(monthly).sort((a,b)=>new Date('1 '+a[0])-new Date('1 '+b[0])).map(([m,v])=>{
    cum+=v;return{month:m,actuals:Math.round(v*100)/100,actuals_burn:Math.round((poVal-cum)*100)/100};
  });
}

  const actMap={};D.actuals.forEach(m=>{actMap[m.month]={actuals:m.actuals,actuals_burn:m.actuals_burn};});

  const monthly=allMonths.map(m=>({Month:m,'Forecast Spend':fcMap[m]?fcMap[m].forecast:null,'Actuals Spend':actMap[m]?actMap[m].actuals:null,Variance:(actMap[m]&&fcMap[m])?Math.round((actMap[m].actuals-fcMap[m].forecast)*100)/100:null,'Forecast Burn':fcMap[m]?fcMap[m].forecast_burn:null,'Actuals Burn':actMap[m]?actMap[m].actuals_burn:null}));
  const normFilter=selectedPoTeams.length?selectedPoTeams.map(t=>t.replace(/\s+/g,'')):null;
  const invs=(D.cfg.invoices||[]).filter(i=>normFilter?normFilter.includes((i.po_team||'').replace(/\s+/g,'')):true);

}

function doSave(key){
  const raw=document.getElementById('cfg_'+key).value;
  let val;
  try{val=JSON.parse(raw);}catch(e){toast('✗ Invalid JSON: '+e.message,false);return;}
  const errs=validateData(key,val);
  if(errs.length){toast('✗ Validation failed — see errors below',false);document.getElementById('cfg_'+key).insertAdjacentHTML('afterend','<div class="val-err"><strong>⚠️ Validation Errors:</strong><ul>'+errs.map(e=>'<li>'+e+'</li>').join('')+'</ul></div>');return;}
  // Clear previous errors
  const prev=document.getElementById('cfg_'+key).parentElement.querySelector('.val-err');if(prev)prev.remove();
  const cfg=loadWork();cfg[key]=val;saveWork(cfg);toast('✓ Saved '+key);setTimeout(render,400);
}

function exportFullConfig(){
  const cfg=loadWork();
  const exportData={po_details:cfg.po_details,resources:cfg.resources,fx_rates:cfg.fx_rates,ot_params:cfg.ot_params,expenses:cfg.expenses,invoices:cfg.invoices||[],actuals_monthly:cfg.actuals_monthly};
  const blob=new Blob([JSON.stringify(exportData,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='finance_config_'+new Date().toISOString().slice(0,10)+'.json';a.click();
  toast('✓ Config exported as JSON');
}
function importFullConfig(){
  const file=document.getElementById('fullCfgImport').files[0];
  const status=document.getElementById('fullCfgStatus');
  if(!file){status.innerHTML='<span style="color:#c62828">⚠️ Please select a JSON file first.</span>';return;}
  file.text().then(t=>{
    let data;
    try{data=JSON.parse(t);}catch(e){status.innerHTML='<span style="color:#c62828">❌ Invalid JSON: '+e.message+'</span>';return;}
    if(typeof data!=='object'||Array.isArray(data)){status.innerHTML='<span style="color:#c62828">❌ File must be a JSON object with sections (po_details, resources, etc.)</span>';return;}
    const cfg=loadWork();
    const keys=['po_details','resources','fx_rates','ot_params','expenses','invoices','actuals_monthly'];
    const existing=[];
    keys.forEach(k=>{if(data[k]&&Array.isArray(data[k])&&cfg[k]&&cfg[k].length)existing.push(k+' ('+cfg[k].length+' rows)');});
    if(existing.length&&!confirm('⚠️ This will OVERWRITE existing data in:\n\n• '+existing.join('\n• ')+'\n\nContinue?'))return;
    const loaded=[];
    keys.forEach(k=>{if(data[k]&&Array.isArray(data[k])){cfg[k]=data[k];loaded.push(k+' ('+data[k].length+')');}});
    if(!loaded.length){status.innerHTML='<span style="color:#c62828">❌ No recognized sections found. Expected: '+keys.join(', ')+'</span>';return;}
    saveWork(cfg);
    status.innerHTML='<span style="color:#2e7d32">✅ Imported: '+loaded.join(', ')+'. Dashboard updated!</span>';
    toast('✓ Full config imported — '+loaded.length+' sections loaded');
    setTimeout(render,500);
  });
}
function cfgImportFile(){
  const file=document.getElementById('cfgImportFile').files[0];
  const target=document.getElementById('cfgImportTarget').value;
  const status=document.getElementById('cfgImportStatus');
  if(!file){status.innerHTML='<span style="color:#c62828">Select a file first</span>';return;}
  const ext=file.name.split('.').pop().toLowerCase();
  if(ext==='json'){
    file.text().then(t=>{try{const d=JSON.parse(t);const ta=document.getElementById('cfg_'+target);if(ta){ta.value=JSON.stringify(d,null,2);status.innerHTML=`<span style="color:#2e7d32">✅ ${Array.isArray(d)?d.length+' rows':'object'} loaded into ${target}. Click Save to apply.</span>`;}else{status.innerHTML='<span style="color:#c62828">Open the "'+target+'" section first</span>';}}catch(e){status.innerHTML='<span style="color:#c62828">Invalid JSON: '+e.message+'</span>';}});
  }else if(ext==='csv'){
    file.text().then(t=>{const lines=t.trim().split('\n');const headers=lines[0].split(',').map(h=>h.trim().replace(/"/g,''));const data=lines.slice(1).filter(l=>l.trim()).map(line=>{const vals=line.split(',').map(v=>v.trim().replace(/"/g,''));const obj={};headers.forEach((h,i)=>{const v=vals[i]||'';obj[h]=isNaN(v)||v===''?v:Number(v);});return obj;});const ta=document.getElementById('cfg_'+target);if(ta){ta.value=JSON.stringify(data,null,2);status.innerHTML=`<span style="color:#2e7d32">✅ ${data.length} rows from CSV loaded into ${target}. Click Save to apply.</span>`;}else{status.innerHTML='<span style="color:#c62828">Open the "'+target+'" section first</span>';}});
  }else if(ext==='xlsx'||ext==='xls'){
    file.arrayBuffer().then(buf=>{const wb=XLSX.read(buf);const ws=wb.Sheets[wb.SheetNames[0]];const data=XLSX.utils.sheet_to_json(ws);const ta=document.getElementById('cfg_'+target);if(ta){ta.value=JSON.stringify(data,null,2);status.innerHTML=`<span style="color:#2e7d32">✅ ${data.length} rows from sheet "${wb.SheetNames[0]}" loaded into ${target}. Click Save to apply.</span>`;}else{status.innerHTML='<span style="color:#c62828">Open the "'+target+'" section first</span>';}});
  }else{status.innerHTML='<span style="color:#c62828">Unsupported file type: .'+ext+'</span>';}
}
function validateData(key,data){
  const errs=[];
  if(!Array.isArray(data)){errs.push('Data must be a JSON array');return errs;}
  if(key==='po_details'){
    const req=['PO_Team_Identifier','PO_WO_value','PO_Currency_Code','PO_Validity','WO_StartDate'];
    data.forEach((p,i)=>{
      req.forEach(f=>{if(!p[f]&&p[f]!==0)errs.push(`Row ${i+1}: missing required field "${f}"`);});
      if(p.PO_WO_value&&(typeof p.PO_WO_value!=='number'||p.PO_WO_value<=0))errs.push(`Row ${i+1}: PO_WO_value must be a positive number`);
      if(p.PO_Validity&&!/^\d{1,2}-\d{2,4}$/.test(String(p.PO_Validity)))errs.push(`Row ${i+1}: PO_Validity must be mm-yy format (e.g. "12-25")`);
      if(p.WO_StartDate&&!/^\d{4}-\d{2}-\d{2}$/.test(p.WO_StartDate))errs.push(`Row ${i+1}: WO_StartDate must be yyyy-mm-dd`);
      if(p.rollover_allowed!==undefined&&typeof p.rollover_allowed!=='boolean')errs.push(`Row ${i+1}: rollover_allowed must be true/false`);
    });
  }else if(key==='resources'){
    data.forEach((r,i)=>{
      if(!r.name&&!r['Empl Name'])errs.push(`Row ${i+1}: missing name`);
      if(!r.po_team&&!r.PO_Team_Identifier)errs.push(`Row ${i+1}: missing po_team`);
      if(!r.start&&!r.RateEffectiveDt)errs.push(`Row ${i+1}: missing start date`);
      if(!r.end&&!r.ContractEndDt)errs.push(`Row ${i+1}: missing end date`);
      if(r.bill_rate!==undefined&&(isNaN(parseFloat(r.bill_rate))))errs.push(`Row ${i+1}: bill_rate must be a number`);
      if(r.alloc!==undefined&&(parseFloat(r.alloc)<0||parseFloat(r.alloc)>1))errs.push(`Row ${i+1}: alloc must be 0-1`);
    });
  }else if(key==='invoices'){
    data.forEach((inv,i)=>{
      if(!inv.po_team)errs.push(`Row ${i+1}: missing po_team`);
      if(!inv.invoice_number)errs.push(`Row ${i+1}: missing invoice_number`);
      if(!inv.amount||typeof inv.amount!=='number')errs.push(`Row ${i+1}: amount must be a number`);
      if(!inv.period_from||!/^\d{4}-\d{2}-\d{2}$/.test(inv.period_from))errs.push(`Row ${i+1}: period_from must be yyyy-mm-dd`);
      if(!inv.period_to||!/^\d{4}-\d{2}-\d{2}$/.test(inv.period_to))errs.push(`Row ${i+1}: period_to must be yyyy-mm-dd`);
      if(inv.status&&!['Paid','Submitted','Draft'].includes(inv.status))errs.push(`Row ${i+1}: status must be Paid/Submitted/Draft`);
    });
  }else if(key==='fx_rates'){
    data.forEach((r,i)=>{
      if(!r.code)errs.push(`Row ${i+1}: missing currency code`);
      if(!r.effective||!/^\d{4}-\d{2}-\d{2}$/.test(r.effective))errs.push(`Row ${i+1}: effective must be yyyy-mm-dd`);
      if(r.rate===undefined||typeof r.rate!=='number')errs.push(`Row ${i+1}: rate must be a number`);
    });
  }else if(key==='expenses'){
    data.forEach((e,i)=>{
      if(!e.name)errs.push(`Row ${i+1}: missing name`);
      if(!e.date||!/^\d{4}-\d{2}-\d{2}$/.test(e.date))errs.push(`Row ${i+1}: date must be yyyy-mm-dd`);
      if(e.amount===undefined||typeof e.amount!=='number')errs.push(`Row ${i+1}: amount must be a number`);
    });
  }
  return errs;
}

function checkPin(action){
  const pin=document.getElementById('pinInput').value;
  document.querySelector('.modal-bg').remove();
  if(pin!==MASTER_PIN){toast('✗ Incorrect PIN',false);return;}
  if(action==='save'){const cfg=loadWork();saveMaster(cfg);toast('✓ Master config updated!');}
  if(action==='reset'){localStorage.removeItem(K_WORK);localStorage.removeItem(K_MASTER);toast('✓ Factory reset complete!');setTimeout(render,400);}
}

// ─── CHARTS ─────────────────────────────────────────────────────────────────
function drawCharts(tab,D){
  if(tab==='overview'){const am=D.actuals,fc=D.fc.burndown;const fcMap={};fc.forEach(m=>{fcMap[m.month]=m.forecast;});const actMap={};am.forEach(m=>{actMap[m.month]=m.actuals;});const labels=[...new Set([...Object.keys(fcMap),...Object.keys(actMap)])].sort((a,b)=>new Date('1 '+a)-new Date('1 '+b));const ctx=document.getElementById('c1');if(!ctx)return;charts.push(new Chart(ctx,{type:'bar',data:{labels,datasets:[{label:'Forecast (£)',data:labels.map(l=>fcMap[l]||null),backgroundColor:'rgba(33,150,243,0.7)'},{label:'Actuals (£)',data:labels.map(l=>actMap[l]||null),backgroundColor:'rgba(76,175,80,0.7)'}]},options:{responsive:true,plugins:{legend:{position:'top'},datalabels:{display:showDataLabels,formatter:v=>v?'£'+Math.round(v/1000)+'k':'',font:{size:10},anchor:'end',align:'top'}},scales:{y:{beginAtZero:true,ticks:{callback:v=>'£'+v.toLocaleString()}}}}}));}
  if(tab==='burndown'){const am=D.actuals,fm=D.fc.burndown;const allMonths=[...new Set([...am.map(m=>m.month),...fm.map(m=>m.month)])];const ctx=document.getElementById('c2');if(!ctx)return;
    // Aggregate expenses by month for burndown inclusion
    const expByMonth={};
    (D.filteredExpenses||[]).forEach(e=>{
      const d=new Date(e.date);if(isNaN(d))return;
      const key=d.toLocaleString('en',{month:'short'})+'-'+String(d.getFullYear()).slice(2);
      expByMonth[key]=(expByMonth[key]||0)+e.amount;
    });
    // Ensure expense months are in allMonths
    Object.keys(expByMonth).forEach(m=>{if(!allMonths.includes(m))allMonths.push(m);});
    allMonths.sort((a,b)=>new Date('1 '+a)-new Date('1 '+b));
    // Actuals burn: PO_Available_at_month - cumulative actuals
    // Forecast burn: PO_Available_at_month - cumulative forecast
    // First compute cumPO per month
    const poArr=D.cfg.po_details||[];
    const normFilter2=selectedPoTeams.length?selectedPoTeams.map(t=>t.replace(/\s+/g,'')):null;
    const cumPO=allMonths.map(mKey=>{
      const [mName,yy]=mKey.split('-');const yr=parseInt('20'+yy);
      const mIdx=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'].indexOf(mName);
      const monthEnd=new Date(yr,mIdx+1,0);
      let total=0;
      poArr.forEach(p=>{
        const t=(p.PO_Team_Identifier||'').replace(/\s+/g,'');
        if(normFilter2&&!normFilter2.includes(t))return;
        const poEnd2=parseValidityEnd(p.PO_Validity||p.PO_Validity_Year);
        if(new Date(p.WO_StartDate)<=monthEnd&&poEnd2>=monthEnd)total+=p.PO_WO_value;
      });
      return total;
    });
    // Now compute burn lines using cumPO as the baseline (expenses included in actuals burn)
    let cumAct=0;const actBurn=allMonths.map((l,i)=>{const m=am.find(x=>x.month===l);const exp=expByMonth[l]||0;if(m&&m.actuals){cumAct+=m.actuals+exp;return cumPO[i]-cumAct;}else if(exp){cumAct+=exp;return cumPO[i]-cumAct;}return cumPO[i]?cumPO[i]-cumAct:null;});
    let cumFc=0;const fcBurn=allMonths.map((l,i)=>{const m=fm.find(x=>x.month===l);if(m){cumFc+=m.forecast;return cumPO[i]-cumFc;}return cumPO[i]?cumPO[i]-cumFc:null;});
    const fcSpend=allMonths.map(l=>{const m=fm.find(x=>x.month===l);return m?m.forecast:null;});
    const actSpend=allMonths.map(l=>{const m=am.find(x=>x.month===l);return m?m.actuals:null;});
    charts.push(new Chart(ctx,{type:"bar",data:{labels:allMonths,datasets:[{label:"Forecast Spend",data:fcSpend,backgroundColor:"rgba(33,150,243,0.4)",order:2},{label:"Actuals Spend",data:actSpend,backgroundColor:"rgba(76,175,80,0.4)",order:2},{label:"Actuals Burn",type:"line",data:actBurn,borderColor:"#4caf50",borderWidth:2,tension:0.3,spanGaps:false,pointRadius:3,order:1,yAxisID:"y1"},{label:"Forecast Burn",type:"line",data:fcBurn,borderColor:"#2196f3",borderWidth:2,tension:0.3,pointRadius:3,order:1,yAxisID:"y1"},{label:"PO Available",type:"line",data:cumPO,borderColor:"#f44336",borderDash:[5,5],pointRadius:2,borderWidth:2,order:0,yAxisID:"y1"}]},options:{responsive:true,plugins:{legend:{position:"top"},datalabels:{display:showDataLabels,formatter:v=>v!=null?'£'+Math.round(v/1000)+'k':'',font:{size:9},anchor:'end',align:'top'}},scales:{y:{position:"left",title:{display:true,text:"Monthly Spend"},beginAtZero:true,ticks:{callback:v=>"£"+v.toLocaleString()}},y1:{position:"right",title:{display:true,text:"PO Burn"},ticks:{callback:v=>"£"+v.toLocaleString()},grid:{drawOnChartArea:false}}}}}));
    // Normalized chart (combo: bars for spend + lines for burn)
    const today2=new Date().toISOString().slice(0,10);
    const fxF=fxRateAsOf(D.cfg.fx_rates,D.fc.currency||'GBP',today2);
    const fxT=fxRateAsOf(D.cfg.fx_rates,D.fc.normCurrency||'USD',today2);
    const norm=v=>v!=null?Math.round(v/fxF*fxT):null;
    const ctx2=document.getElementById('c2norm');
    if(ctx2){charts.push(new Chart(ctx2,{type:'bar',data:{labels:allMonths,datasets:[
      {label:'Forecast Spend ('+D.fc.normCurrency+')',data:fcSpend.map(norm),backgroundColor:'rgba(33,150,243,0.4)',order:2},
      {label:'Actuals Spend ('+D.fc.normCurrency+')',data:actSpend.map(norm),backgroundColor:'rgba(76,175,80,0.4)',order:2},
      {label:'Actuals Burn ('+D.fc.normCurrency+')',type:'line',data:actBurn.map(norm),borderColor:'#4caf50',borderWidth:2,tension:0.3,spanGaps:true,pointRadius:3,order:1,yAxisID:'y1'},
      {label:'Forecast Burn ('+D.fc.normCurrency+')',type:'line',data:fcBurn.map(norm),borderColor:'#2196f3',borderWidth:2,tension:0.3,pointRadius:3,order:1,yAxisID:'y1'},
      {label:'PO Available ('+D.fc.normCurrency+')',type:'line',data:cumPO.map(norm),borderColor:'#f44336',borderDash:[5,5],pointRadius:2,borderWidth:2,order:0,yAxisID:'y1'}
    ]},options:{responsive:true,plugins:{legend:{position:'top'},datalabels:{display:showDataLabels,formatter:v=>v!=null?'£'+Math.round(v/1000)+'k':'',font:{size:9},anchor:'end',align:'top'}},scales:{y:{position:'left',title:{display:true,text:'Monthly Spend ('+D.fc.normCurrency+')'},beginAtZero:true,ticks:{callback:v=>'$'+v.toLocaleString()}},y1:{position:'right',title:{display:true,text:'PO Burn ('+D.fc.normCurrency+')'},ticks:{callback:v=>'$'+v.toLocaleString()},grid:{drawOnChartArea:false}}}}}));}
  }
  if(tab==='monthly'){const am=D.actuals,fc=D.fc.burndown;const fcMap={};fc.forEach(m=>{fcMap[m.month]=m.forecast;});const actMap={};am.forEach(m=>{actMap[m.month]=m.actuals;});const labels=[...new Set([...Object.keys(fcMap),...Object.keys(actMap)])].sort((a,b)=>new Date('1 '+a)-new Date('1 '+b));const varData=labels.map(l=>(actMap[l]!=null&&fcMap[l]!=null)?actMap[l]-fcMap[l]:null);const ctx=document.getElementById('c3');if(!ctx)return;charts.push(new Chart(ctx,{type:'bar',data:{labels,datasets:[{label:'Variance (Act−Fc)',data:varData,backgroundColor:varData.map(v=>v!=null?(v>0?'rgba(244,67,54,0.7)':'rgba(76,175,80,0.7)'):'rgba(200,200,200,0.3)')}]},options:{responsive:true,plugins:{legend:{position:'top'},datalabels:{display:showDataLabels,formatter:v=>v!=null?'£'+Math.round(v/1000)+'k':'',font:{size:10},anchor:'end',align:'top'}},scales:{y:{ticks:{callback:v=>'£'+v.toLocaleString()}}}}}));}
}
render();
</script><button class="chat-toggle" onclick="toggleChatPanel()" title="AI Assistant">🤖</button>
<div class="chat-panel" id="chatPanel">
<div class="chat-hdr"><span>🤖 AI Assistant</span><div><button onclick="switchChatMode()" id="chatModeBtn" style="font-size:.6rem;border:1px solid rgba(255,255,255,.3);border-radius:3px;padding:1px 6px;margin-right:4px">Mode</button><button onclick="document.getElementById('chatPanel').classList.remove('open')">✕</button></div></div>
<div id="chatBody">
<div class="chat-msgs" id="chatMsgs"><div class="chat-msg ai">Hi! Ask me about your project finance data. <br><span style="font-size:.65rem;color:#888">Mode: <span id="chatModeLabel">Direct</span> · <a href="#" onclick="showCopilotSetup();return false" style="color:#2196f3">Setup Copilot Studio</a></span></div></div>
<div class="chat-input"><input id="chatIn" placeholder="Ask about your data..." onkeydown="if(event.key==='Enter')sendChat()"><button onclick="sendChat()">Send</button></div>
</div>
<div id="copilotFrame" style="display:none;flex:1"><iframe id="copilotIframe" style="width:100%;height:420px;border:none"></iframe></div>
</div>
<script>
let chatMode=localStorage.getItem('pf_chat_mode')||'direct'; // 'direct' or 'copilot'
let copilotUrl=localStorage.getItem('pf_copilot_url')||'';

function toggleChatPanel(){document.getElementById('chatPanel').classList.toggle('open');}
function switchChatMode(){
  if(chatMode==='direct'){chatMode='copilot';if(copilotUrl){showCopilotFrame();}else{showCopilotSetup();}}
  else{chatMode='direct';document.getElementById('chatBody').style.display='';document.getElementById('copilotFrame').style.display='none';}
  localStorage.setItem('pf_chat_mode',chatMode);
  document.getElementById('chatModeLabel').textContent=chatMode==='copilot'?'Copilot Studio':'Direct';
}
function showCopilotFrame(){
  document.getElementById('chatBody').style.display='none';
  document.getElementById('copilotFrame').style.display='flex';
  document.getElementById('copilotIframe').src=copilotUrl;
}
function showCopilotSetup(){
  const url=prompt('Paste your Copilot Studio embed URL:\n(From Copilot Studio → Channels → Custom website → Copy embed URL)');
  if(url){copilotUrl=url;localStorage.setItem('pf_copilot_url',url);chatMode='copilot';localStorage.setItem('pf_chat_mode','copilot');showCopilotFrame();document.getElementById('chatModeLabel').textContent='Copilot Studio';}
}
async function sendChat(){
  const input=document.getElementById('chatIn');
  const msg=input.value.trim();if(!msg)return;
  input.value='';
  const msgs=document.getElementById('chatMsgs');
  msgs.innerHTML+=`<div class="chat-msg user">${msg}</div>`;
  msgs.scrollTop=msgs.scrollHeight;
  const D=buildData();
  const ctx=`Dashboard context: PO Value=${D.fc.totalPOValue}, Forecast=${D.fc.total}, Actuals=${D.tAct}, Remaining=${D.rem}, Resources=${D.cfg.resources.length}, Year=${selectedYear||'All'}, Teams=${D.allPoTeams.join(',')}. Top resources: ${D.cfg.resources.slice(0,8).map(r=>r.name+'('+r.po_team+',£'+r.bill_rate+')').join('; ')}`;
  try{
    msgs.innerHTML+=`<div class="chat-msg ai" id="chatLoading">⏳ Thinking...</div>`;
    const resp=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'system',content:'You are a project finance assistant. Answer concisely. '+ctx},{role:'user',content:msg}]})});
    document.getElementById('chatLoading')?.remove();
    if(!resp.ok){const err=await resp.json();msgs.innerHTML+=`<div class="chat-msg err">⚠️ ${err.error}</div>`;}
    else{const data=await resp.json();msgs.innerHTML+=`<div class="chat-msg ai">${data.content}</div>`;}
  }catch(e){document.getElementById('chatLoading')?.remove();msgs.innerHTML+=`<div class="chat-msg err">⚠️ AI unavailable. Try Copilot Studio mode (click Mode button).</div>`;}
  msgs.scrollTop=msgs.scrollHeight;
}
</script>
