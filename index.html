const HOLIDAY_SETS={};Object.entries(HOLIDAYS_BY_LOC).forEach(([k,v])=>{HOLIDAY_SETS[k]=new Set(v);});

function isWorkingDay(d,location){
  const dow=d.getDay();
  if(dow===0||dow===6)return false;
  const hols=HOLIDAY_SETS[location||'UK']||HOLIDAY_SETS['UK'];
  return !hols.has(d.toISOString().slice(0,10));
}

// Effective-dated FX lookup: latest rate on or before asOfDate
function fxRateAsOf(fxRates,code,asOfDate){
  let best=null,bestDt='';
  fxRates.forEach(r=>{if(r.code===code&&r.effective<=asOfDate&&r.effective>bestDt){best=r.rate;bestDt=r.effective;}});
  return best||1;
}

// Effective-dated rate lookup for a resource: find the rule where start<=date<=end
function findResourceRule(resources,emplId,poTeam,asOfDate){
  // Find the rule with latest start date that is <= asOfDate and end >= asOfDate
  let best=null;
  resources.forEach(r=>{
    if(r.empl_id===emplId&&(r.po_team||'')===(poTeam||'')&&r.start<=asOfDate&&r.end>=asOfDate){
      if(!best||r.start>best.start)best=r;
    }
  });
  return best;
}

// OT multiplier lookup
function otMultiplier(otParams,poTeam,otType,asOfDate){
  let best=null,bestDt='';
  otParams.forEach(r=>{if(r.type===otType&&r.effective<=asOfDate&&r.effective>bestDt){best=r.multiplier;bestDt=r.effective;}});
  return best||1;
}

// Parse date: handles dd/mm/yyyy, mm/dd/yyyy, yyyy-mm-dd, m/d/yyyy
// format hint: 'uk'=dd/mm/yyyy, 'us'=mm/dd/yyyy, auto=detect
function parseDate(s,format){
  if(!s)return '';
  s=String(s).trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10); // already ISO
  const parts=s.split(/[\/\-]/);
  if(parts.length===3){
    let a=parseInt(parts[0]),b=parseInt(parts[1]),y=parts[2];
    if(y.length===2)y='20'+y;
    if(y.length===4){
      if(format==='uk')return `${y}-${String(b).padStart(2,'0')}-${String(a).padStart(2,'0')}`;
      if(format==='us')return `${y}-${String(a).padStart(2,'0')}-${String(b).padStart(2,'0')}`;
      // Auto-detect: if first part > 12, it must be day (dd/mm)
      if(a>12)return `${y}-${String(b).padStart(2,'0')}-${String(a).padStart(2,'0')}`;
      // If second part > 12, first must be month (mm/dd)
      if(b>12)return `${y}-${String(a).padStart(2,'0')}-${String(b).padStart(2,'0')}`;
      // Ambiguous: default to US (m/d/yyyy) since timesheets are larger dataset
      return `${y}-${String(a).padStart(2,'0')}-${String(b).padStart(2,'0')}`;
    }
  }
  const d=new Date(s);
  return isNaN(d)?'':d.toISOString().slice(0,10);
}

function computeForecast(cfg,filterPoTeams){
  // Aggregate PO details: sum PO_WO_value per PO_Team, max PO_Validity_Year, earliest WO_StartDate
  const poArr=cfg.po_details; // now an array
  const poByTeam={};
  poArr.forEach(po=>{
    const key=(po.PO_Team_Identifier||'').replace(/\s+/g,'');
    if(!poByTeam[key])poByTeam[key]={PO_WO_value:0,PO_Validity_Year:0,WO_StartDate:'9999-12-31',PO_Currency_Code:po.PO_Currency_Code,Normalized_Currency_Code:po.Normalized_Currency_Code,WO_Approval_Status:po.WO_Approval_Status,PO_Team_Identifier:key};
    poByTeam[key].PO_WO_value+=po.PO_WO_value;
    poByTeam[key].PO_Validity_Year=Math.max(poByTeam[key].PO_Validity_Year,po.PO_Validity_Year);
    if(po.WO_StartDate<poByTeam[key].WO_StartDate)poByTeam[key].WO_StartDate=po.WO_StartDate;
  });

  // Filter by slicer (normalize keys)
  const normFilter=filterPoTeams&&filterPoTeams.length?filterPoTeams.map(t=>t.replace(/\s+/g,'')):null;
  const activeTeams=normFilter||Object.keys(poByTeam);
  const activePOs=activeTeams.map(t=>poByTeam[t]).filter(Boolean);

  const totalPOValue=activePOs.reduce((s,p)=>s+p.PO_WO_value,0);
  const maxValidYear=activePOs.reduce((m,p)=>Math.max(m,p.PO_Validity_Year),2025);
  const earliestStart=activePOs.reduce((m,p)=>(p.WO_StartDate&&p.WO_StartDate<m)?p.WO_StartDate:m,'9999-12-31');
  const currency=activePOs[0]||{PO_Currency_Code:'GBP',Normalized_Currency_Code:'USD'};

  const poStart=new Date(earliestStart!=='9999-12-31'?earliestStart:'2025-01-01');
  const poEnd=new Date(maxValidYear,11,31);
  const daily={};
  const STD_HOURS=8;

  // Filter resources by selected PO_Teams (normalized)
  const resources=cfg.resources.filter(r=>{
    const rTeam=(r.po_team||'').replace(/\s+/g,'');
    return normFilter?normFilter.includes(rTeam):true;
  });

  // Forecast: BillRate × Allocation% × 8 for working days within resource dates AND within PO validity
  resources.forEach(r=>{
    if(!r.bill_rate)return;
    const rTeam=(r.po_team||'').replace(/\s+/g,'');
    const teamPO=poByTeam[rTeam];
    const teamEnd=teamPO?new Date(teamPO.PO_Validity_Year,11,31):poEnd;
    const rStart=new Date(Math.max(new Date(r.start),poStart));
    const rEnd=new Date(Math.min(new Date(r.end),teamEnd));
    if(rStart>rEnd||isNaN(rStart.getTime())||isNaN(rEnd.getTime()))return;
    const dailyCost=r.bill_rate*r.alloc*STD_HOURS;
    let d=new Date(rStart);
    while(d<=rEnd){
      if(isWorkingDay(d,r.location)){const k=d.toISOString().slice(0,10);daily[k]=(daily[k]||0)+dailyCost;}
      d=new Date(d.getTime()+86400000);
    }
  });

  // Monthly aggregation
  const monthly={};
  Object.entries(daily).sort().forEach(([d,c])=>{
    const dt=new Date(d);
    const key=dt.toLocaleString('en',{month:'short'})+'-'+String(dt.getFullYear()).slice(2);
    monthly[key]=(monthly[key]||0)+c;
  });

  let remFc=totalPOValue;
  const burndown=Object.entries(monthly).map(([m,c])=>{remFc-=c;return{month:m,forecast:Math.round(c*100)/100,forecast_burn:Math.round(remFc*100)/100};});
  const total=Object.values(monthly).reduce((a,b)=>a+b,0);
  const days=Object.keys(daily).length;

  // FX normalization (date-effective)
  const today=new Date().toISOString().slice(0,10);
  // FX normalization: convert each PO's value from its currency to normalized currency using date-effective rates
  let normPO=0;
  activePOs.forEach(p=>{
    const fxFrom=fxRateAsOf(cfg.fx_rates,p.PO_Currency_Code,today);
    const fxTo=fxRateAsOf(cfg.fx_rates,p.Normalized_Currency_Code||'USD',today);
    normPO+=(p.PO_WO_value/fxFrom)*fxTo;
  });

  return{monthly,burndown,total:Math.round(total*100)/100,days,rate:days?Math.round(total/days*100)/100:0,normPO:Math.round(normPO*100)/100,totalPOValue,currency:currency.PO_Currency_Code,normCurrency:currency.Normalized_Currency_Code||'USD',status:currency.WO_Approval_Status||'Approved'};
}

let selectedPoTeams=[]; // empty = all

function buildData(){
  const cfg=loadWork();const fc=computeForecast(cfg,selectedPoTeams);
  const normFilter=selectedPoTeams.length?selectedPoTeams.map(t=>t.replace(/\s+/g,'')):null;
  const projToTeam={};
  cfg.resources.forEach(r=>{const t=(r.po_team||'').replace(/\s+/g,'');if(r.projectID&&t)projToTeam[r.projectID]=t;});
  (cfg.po_details||[]).forEach(p=>{const t=(p.PO_Team_Identifier||'').replace(/\s+/g,'');if(p.ProjectID&&t)projToTeam[p.ProjectID]=t;});

  // Use pre-computed cache for fast filtering
  let filteredActuals;
  if(cfg.actuals_by_project){
    filteredActuals=computeActualsFromCache(cfg,normFilter,projToTeam);
  }else if(cfg.raw_actuals&&cfg.raw_actuals.length){
    filteredActuals=computeActualsMonthly(cfg,normFilter,projToTeam);
  }else{
    filteredActuals=cfg.actuals_monthly||[];
  }

  const tAct=filteredActuals.reduce((s,m)=>s+(m.actuals||0),0);
  const tExp=cfg.expenses.reduce((s,e)=>s+e.amount,0);
  const fromRes=cfg.resources.map(r=>(r.po_team||'').replace(/\s+/g,'')).filter(Boolean);
  const fromPO=(cfg.po_details||[]).map(p=>(p.PO_Team_Identifier||'').replace(/\s+/g,'')).filter(Boolean);
  const allPoTeams=[...new Set([...fromRes,...fromPO])].sort();
  return{cfg,fc,tAct:Math.round(tAct*100)/100,tExp:Math.round(tExp*100)/100,rem:Math.round((fc.totalPOValue-tAct-tExp)*100)/100,allPoTeams,actuals:filteredActuals};
}

// Compute actuals from raw timesheet data, filtered by PO_Team
function computeActualsMonthly(cfg,normFilter,projToTeam){
  if(!cfg.raw_actuals||!cfg.raw_actuals.length)return cfg.actuals_monthly||[];
  const monthly={};
  cfg.raw_actuals.forEach(row=>{
    const projId=parseInt(row['Project ID']||row.project_id||0);
    const team=projToTeam[projId]||'';
    if(normFilter&&!normFilter.includes(team))return;
    const dtRaw=row['Reported Dt']||row.reported_dt||'';
    const dt=parseDate(dtRaw,'us');if(!dt)return;
    const d=new Date(dt);if(isNaN(d.getTime()))return;
    const key=d.toLocaleString('en',{month:'short'})+'-'+String(d.getFullYear()).slice(2);
    const regHrs=parseFloat(row['Regular Hours']||0);
    const otHrs=parseFloat(row['Overtime Hours']||0);
    const emplId=parseInt(row['Empl ID']||0);
    // Find matching resource rule (effective-dated)
    const rule=cfg.resources.find(r=>r.empl_id===emplId&&r.start<=dt&&r.end>=dt)
      ||cfg.resources.find(r=>r.empl_id===emplId);
    const rate=rule?rule.bill_rate:0;
    const hourMult=rule?rule.hour_mult:1;
    const poTeam=rule?(rule.po_team||'').replace(/\s+/g,''):'';
    const otMult=otMultiplier(cfg.ot_params,poTeam,'Overtime_Hours',dt);
    const cost=(regHrs*hourMult*rate)+(otHrs*hourMult*rate*otMult);
    if(!monthly[key])monthly[key]=0;
    monthly[key]+=cost;
  });
  const poVal=(cfg.po_details||[]).reduce((s,p)=>{
    const t=(p.PO_Team_Identifier||'').replace(/\s+/g,'');
    return(normFilter&&!normFilter.includes(t))?s:s+p.PO_WO_value;
  },0);
  let cum=0;
  return Object.entries(monthly).sort((a,b)=>new Date('1 '+a[0])-new Date('1 '+b[0])).map(([m,v])=>{
    cum+=v;return{month:m,actuals:Math.round(v*100)/100,forecast:null,actuals_burn:Math.round((poVal-cum)*100)/100,forecast_burn:null};
  });
}

// Sortable tables - use event delegation
document.addEventListener('click',function(e){
  const th=e.target.closest('th[data-sort]');
  if(!th)return;
  const tbl=th.closest('table');if(!tbl)return;
  const col=parseInt(th.dataset.sort);
  const tbody=tbl.querySelector('tbody');
  const rows=[...tbody.querySelectorAll('tr')];
  const dir=tbl.dataset.sortDir==='asc'?'desc':'asc';tbl.dataset.sortDir=dir;
  rows.sort((a,b)=>{
    let av=a.cells[col]?a.cells[col].textContent.trim():'',bv=b.cells[col]?b.cells[col].textContent.trim():'';
    // Try as number
    const an=parseFloat(av.replace(/[£$,%—]/g,'')),bn=parseFloat(bv.replace(/[£$,%—]/g,''));
    if(!isNaN(an)&&!isNaN(bn))return dir==='asc'?an-bn:bn-an;
    // Try as date
    const ad=new Date(av),bd=new Date(bv);
    if(!isNaN(ad)&&!isNaN(bd))return dir==='asc'?ad-bd:bd-ad;
    return dir==='asc'?av.localeCompare(bv):bv.localeCompare(av);
  });
  rows.forEach(r=>tbody.appendChild(r));
});

function rTL(D){
  // Filter resources by slicer
  const normFilter=selectedPoTeams.length?selectedPoTeams.map(t=>t.replace(/\s+/g,'')):null;
  const res=D.cfg.resources.filter(r=>{
    if(!r.bill_rate)return false;
    const t=(r.po_team||'').replace(/\s+/g,'');
    return normFilter?normFilter.includes(t):true;
  });
  // Determine date range from resources
  const allStarts=res.map(r=>new Date(r.start)).filter(d=>!isNaN(d));
  const allEnds=res.map(r=>new Date(r.end)).filter(d=>!isNaN(d));
  const start=allStarts.length?new Date(Math.min(...allStarts)):new Date('2025-01-01');
  const end=allEnds.length?new Date(Math.max(...allEnds)):new Date('2026-12-31');
  const span=end-start||1;
  const colors=['#5c6bc0','#26a69a','#e65100','#8e24aa','#2e7d32','#c62828','#1565c0','#4e342e','#00838f'];
  // Group by PO_Team
  const groups={};res.forEach(r=>{const t=r.po_team||'Unknown';if(!groups[t])groups[t]=[];groups[t].push(r);});
  let h='<div class="box"><h2>Resource Timeline</h2>';
  // Month markers
  h+='<div style="margin-left:140px;position:relative;height:18px;font-size:.6rem;color:#888;margin-bottom:4px">';
  let md=new Date(start.getFullYear(),start.getMonth(),1);
  while(md<=end){const l=((md-start)/span*100);if(l>=0&&l<=100)h+=`<span style="position:absolute;left:${l.toFixed(1)}%">${md.toLocaleString('en',{month:'short',year:'2-digit'})}</span>`;md=new Date(md.getFullYear(),md.getMonth()+1,1);}
  h+='</div>';
  Object.entries(groups).forEach(([team,members])=>{
    h+=`<div style="font-size:.72rem;font-weight:700;margin:8px 0 2px;color:#1a1a2e;border-bottom:1px solid #e0e0e0;padding-bottom:2px">${team}</div>`;
    // Group by person (empl_id + po_team) — show multiple bars on same line
    const byPerson={};
    members.forEach(r=>{const key=`${r.empl_id}|${r.name}`;if(!byPerson[key])byPerson[key]=[];byPerson[key].push(r);});
    let pi=0;
    Object.entries(byPerson).forEach(([key,rules])=>{
      const [eid,name]=key.split('|');
      h+=`<div class="tl-row"><span class="nm">${name} (${eid})</span><div class="ba">`;
      rules.forEach(r=>{
        const rs=new Date(r.start),re=new Date(r.end);
        if(isNaN(rs)||isNaN(re)||rs>re)return;
        const left=Math.max(0,(rs-start)/span*100).toFixed(1);
        const width=Math.max(1,(re-rs)/span*100).toFixed(1);
        h+=`<div class="br" style="left:${left}%;width:${width}%;background:${colors[pi%colors.length]};opacity:${0.6+r.alloc*0.4}">${r.alloc*100}% £${(r.bill_rate*r.alloc*8).toFixed(0)}/d</div>`;
      });
      h+=`</div></div>`;pi++;
    });
  });
  if(!res.length)h+='<p style="color:#888;font-size:.8rem">No resources for selected filter</p>';

}
function rActData(D){
  const cfg=D.cfg;
  const rawCount=cfg.raw_actuals?cfg.raw_actuals.length:0;
  const normFilter=selectedPoTeams.length?selectedPoTeams.map(t=>t.replace(/\s+/g,'')):null;
  // Build projToTeam
  const projToTeam={};
  cfg.resources.forEach(r=>{const t=(r.po_team||'').replace(/\s+/g,'');if(r.projectID&&t)projToTeam[r.projectID]=t;});
  (cfg.po_details||[]).forEach(p=>{const t=(p.PO_Team_Identifier||'').replace(/\s+/g,'');if(p.ProjectID&&t)projToTeam[p.ProjectID]=t;});

  // Filter raw actuals by slicer
  const filtered=cfg.raw_actuals?cfg.raw_actuals.filter(row=>{
    const projId=parseInt(row['Project ID']||0);
    const team=projToTeam[projId]||'';
    return normFilter?normFilter.includes(team):true;
  }):[];

  // Compute date ranges per project
  const projDates={};
  (cfg.raw_actuals||[]).forEach(row=>{
    const projId=row['Project ID']||'';
    const dt=parseDate(row['Reported Dt']||'','us');if(!dt)return;
    if(!projDates[projId])projDates[projId]={min:dt,max:dt,count:0,team:projToTeam[parseInt(projId)]||''};
    if(dt<projDates[projId].min)projDates[projId].min=dt;

  });

  // Show metrics

  h+=`<div class="card o"><h3>Matched to Resources</h3><div class="v">${filtered.filter(r=>{const eid=parseInt(r['Empl ID']||0);return cfg.resources.some(res=>res.empl_id===eid);}).length.toLocaleString()}</div></div>`;
  h+=`<div class="card r"><h3>Unmatched</h3><div class="v">${filtered.filter(r=>{const eid=parseInt(r['Empl ID']||0);return!cfg.resources.some(res=>res.empl_id===eid);}).length.toLocaleString()}</div></div>`;

    const d=new Date(dt);const key=d.toLocaleString('en',{month:'short'})+'-'+String(d.getFullYear()).slice(2);
    if(!monthBuckets[key])monthBuckets[key]={cost:0,rows:0};

    const rate=rule?rule.bill_rate:0;const hm=rule?rule.hour_mult:1;
    const reg=parseFloat(row['Regular Hours']||0);const ot=parseFloat(row['Overtime Hours']||0);
    monthBuckets[key].cost+=(reg*hm*rate)+(ot*hm*rate);
    monthBuckets[key].rows++;
  });
  Object.entries(monthBuckets).sort((a,b)=>new Date('1 '+a[0])-new Date('1 '+b[0])).forEach(([m,v])=>{
    cum+=v.cost;

  });

  if(filtered.length){

function handleUpload(input,type){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    const text=e.target.result;
    let data;
    if(file.name.endsWith('.json')){
      try{data=JSON.parse(text);}catch(err){toast('✗ Invalid JSON: '+err.message,false);return;}
    }else{
      // Parse CSV
      const lines=text.trim().split('\n');
      const headers=lines[0].split(',').map(h=>h.trim().replace(/"/g,''));
      data=lines.slice(1).map(line=>{
        const vals=line.split(',').map(v=>v.trim().replace(/"/g,''));
        const obj={};headers.forEach((h,i)=>{obj[h]=vals[i]||'';});return obj;
      });
    }
    if(type==='resources'){
      // Normalize resource data
      const resources=data.map(r=>{
        const startRaw=r.start||r.RateEffectiveDt||'';
        const endRaw=r.end||r.ContractEndDt||'';
        return{
          name:r.name||r['Empl Name']||'',empl_id:parseInt(r.empl_id||r['Empl ID']||r.EmplID)||0,
          role:r.role||r.Role||'',location:r.location||r.Location||'UK',
          start:parseDate(startRaw,'uk'),end:parseDate(endRaw,'uk'),
          bill_rate:parseFloat(r.bill_rate||r.BillRate)||0,
          hour_mult:parseFloat(r.hour_mult||r.HourMultiplier_TimeEntry||r.Hour_Multiplier)||1,
          alloc:parseFloat(r.alloc||r.Allocation_Percentage)||1,
          projectID:parseInt(r.projectID||r.ProjectID)||0,
          po_team:(r.po_team||r.PO_Team_Identifier||'').replace(/\s+/g,'')
        };
      }).filter(r=>r.start&&r.end);
      const cfg=loadWork();cfg.resources=resources;saveWork(cfg);
      // Validation warnings
      const warnings=[];
      const poTeams=new Set((cfg.po_details||[]).map(p=>(p.PO_Team_Identifier||'').replace(/\s+/g,'')));
      const unmatchedTeams=new Set(resources.map(r=>r.po_team).filter(t=>!poTeams.has(t)));
      if(unmatchedTeams.size)warnings.push(unmatchedTeams.size+' resource PO_Teams not in PO_Details: '+[...unmatchedTeams].slice(0,3).join(', '));
      const invalidDates=resources.filter(r=>r.start>r.end);
      if(invalidDates.length)warnings.push(invalidDates.length+' resources have start > end date');
      const zeroRate=resources.filter(r=>r.bill_rate===0);
      if(zeroRate.length)warnings.push(zeroRate.length+' resources with zero rate (excluded from forecast)');
      toast(`✓ ${resources.length} resources uploaded`+(warnings.length?' ⚠️ '+warnings.join('; '):''));
      setTimeout(render,400);
    }else if(type==='actuals'){
      // Store raw actuals for processing
      const cfg=loadWork();cfg.raw_actuals=data;saveWork(cfg);
      // Aggregate into monthly
      aggregateActuals(data);
    }
    // Show preview
    document.getElementById('uploadPreview').innerHTML=`<div class="box"><h2>Preview (first 5 rows of ${data.length})</h2><pre style="font-size:.7rem;max-height:200px;overflow:auto">${JSON.stringify(data.slice(0,5),null,2)}</pre></div>`;
  };
  reader.readAsText(file);
}

function aggregateActuals(data){
  const cfg=loadWork();
  cfg.raw_actuals=data;
  // Pre-compute actuals PER PROJECT for fast slicer filtering
  const projToTeam={};
  cfg.resources.forEach(r=>{const t=(r.po_team||'').replace(/\s+/g,'');if(r.projectID&&t)projToTeam[r.projectID]=t;});
  (cfg.po_details||[]).forEach(p=>{const t=(p.PO_Team_Identifier||'').replace(/\s+/g,'');if(p.ProjectID&&t)projToTeam[p.ProjectID]=t;});

  const byProject={};// {projectID: {month: cost}}
  let matched=0,unmatched=0;
  data.forEach(row=>{
    const dtRaw=row['Reported Dt']||'';
    const dt=parseDate(dtRaw,'us');if(!dt)return;
    const d=new Date(dt);if(isNaN(d.getTime()))return;
    const key=d.toLocaleString('en',{month:'short'})+'-'+String(d.getFullYear()).slice(2);
    const emplId=parseInt(row['Empl ID']||0);
    const projId=parseInt(row['Project ID']||0);
    const rule=cfg.resources.find(r=>r.empl_id===emplId&&r.start<=dt&&r.end>=dt)||cfg.resources.find(r=>r.empl_id===emplId);
    if(rule)matched++;else{unmatched++;return;}
    const rate=rule.bill_rate;const hm=rule.hour_mult;
    const poTeam=(rule.po_team||'').replace(/\s+/g,'');
    const otMult=otMultiplier(cfg.ot_params,poTeam,'Overtime_Hours',dt);
    const reg=parseFloat(row['Regular Hours']||0);
    const ot=parseFloat(row['Overtime Hours']||0);
    const cost=(reg*hm*rate)+(ot*hm*rate*otMult);
    if(!byProject[projId])byProject[projId]={};
    byProject[projId][key]=(byProject[projId][key]||0)+cost;
  });
  cfg.actuals_by_project=byProject;
  cfg.actuals_monthly=computeActualsFromCache(cfg,null,projToTeam);
  saveWork(cfg);
  toast(`✓ ${data.length} rows: ${matched} matched, ${unmatched} unmatched → ${Object.keys(byProject).length} projects`);
  setTimeout(render,400);
}

// Fast actuals from pre-computed cache (no re-parsing raw data)
function computeActualsFromCache(cfg,normFilter,projToTeam){
  const byProject=cfg.actuals_by_project||{};
  const monthly={};
  Object.entries(byProject).forEach(([projId,months])=>{
    const team=projToTeam[parseInt(projId)]||'';
    if(normFilter&&!normFilter.includes(team))return;
    Object.entries(months).forEach(([m,cost])=>{monthly[m]=(monthly[m]||0)+cost;});
  });
  const poVal=(cfg.po_details||[]).reduce((s,p)=>{
    const t=(p.PO_Team_Identifier||'').replace(/\s+/g,'');
    return(normFilter&&!normFilter.includes(t))?s:s+p.PO_WO_value;
  },0);
  let cum=0;
  return Object.entries(monthly).sort((a,b)=>new Date('1 '+a[0])-new Date('1 '+b[0])).map(([m,v])=>{
    cum+=v;return{month:m,actuals:Math.round(v*100)/100,actuals_burn:Math.round((poVal-cum)*100)/100};
  });
}

// ─── CONFIG PAGE ────────────────────────────────────────────────────────────
function rCfg(D){
  let h='<div class="box"><h2>⚙️ Working Config</h2>';
  h+='<p style="font-size:.78rem;color:#666;margin-bottom:.8rem">Edit and save freely — this is your working copy. Use "Restore from Master" to undo experiments.</p>';
  h+='<div style="margin-bottom:1rem;display:flex;gap:.5rem;flex-wrap:wrap">';
  h+='<button class="btn btn-orange" onclick="restoreFromMaster();render()">↩️ Restore from Master</button>';
  h+='<button class="btn btn-blue" onclick="promptMasterSave()">🔒 Save as Master (PIN required)</button>';
  h+='</div>';
  const sections=[{key:'po_details',label:'PO Details',data:D.cfg.po_details},{key:'resources',label:'Resources ('+D.cfg.resources.length+')',data:D.cfg.resources,tall:true},{key:'invoices',label:'Invoices ('+(D.cfg.invoices||[]).length+')',data:D.cfg.invoices||[]},{key:'fx_rates',label:'FX Rates',data:D.cfg.fx_rates},{key:'ot_params',label:'OT Params',data:D.cfg.ot_params},{key:'expenses',label:'Expenses',data:D.cfg.expenses},{key:'actuals_monthly',label:'Monthly Actuals',data:D.cfg.actuals_monthly,tall:true}];
  sections.forEach((s,i)=>{
    h+=`<details class="cfg-section"${i===0?' open':''}><summary>${s.label}</summary><div class="inner"><textarea id="cfg_${s.key}"${s.tall?' style="min-height:350px"':''}>${JSON.stringify(s.data,null,2)}</textarea><button class="btn btn-green" onclick="doSave('${s.key}')">💾 Save ${s.label}</button></div></details>`;
  });
  h+='<details class="cfg-section"><summary>🔄 Reset</summary><div class="inner"><p style="font-size:.8rem;margin-bottom:.5rem">Reset working config to master data (no PIN needed):</p><button class="btn btn-orange" onclick="restoreFromMaster();render()">↩️ Restore from Master</button><p style="font-size:.8rem;margin:1rem 0 .5rem">Reset everything to factory defaults (PIN required):</p><button class="btn btn-red" onclick="promptFactoryReset()">⚠️ Factory Reset</button></div></details>';
  h+='</div>';return h;
}
function doSave(key){
  try{const val=JSON.parse(document.getElementById('cfg_'+key).value);const cfg=loadWork();cfg[key]=val;saveWork(cfg);toast('✓ Saved '+key);setTimeout(render,400);}
  catch(e){toast('✗ Invalid JSON: '+e.message,false);}
}
function promptMasterSave(){
  const d=document.createElement('div');d.className='modal-bg';
  d.innerHTML='<div class="modal"><h3>🔒 Save as Master</h3><p style="font-size:.82rem;margin-bottom:.8rem">This overwrites the master config. Enter PIN:</p><input type="password" id="pinInput" placeholder="Enter PIN" maxlength="10"><div><button class="btn btn-green" onclick="checkPin(\'save\')">Confirm</button><button class="btn btn-red" onclick="this.closest(\'.modal-bg\').remove()">Cancel</button></div></div>';
  document.body.appendChild(d);d.querySelector('input').focus();
}
function promptFactoryReset(){
  const d=document.createElement('div');d.className='modal-bg';
  d.innerHTML='<div class="modal"><h3>⚠️ Factory Reset</h3><p style="font-size:.82rem;margin-bottom:.8rem">This resets BOTH master and working config to defaults. Enter PIN:</p><input type="password" id="pinInput" placeholder="Enter PIN" maxlength="10"><div><button class="btn btn-red" onclick="checkPin(\'reset\')">Reset All</button><button class="btn btn-blue" onclick="this.closest(\'.modal-bg\').remove()">Cancel</button></div></div>';
  document.body.appendChild(d);d.querySelector('input').focus();
}
function checkPin(action){
  const pin=document.getElementById('pinInput').value;
  document.querySelector('.modal-bg').remove();
  if(pin!==MASTER_PIN){toast('✗ Incorrect PIN',false);return;}
  if(action==='save'){const cfg=loadWork();saveMaster(cfg);toast('✓ Master config updated!');}
  if(action==='reset'){localStorage.removeItem(K_WORK);localStorage.removeItem(K_MASTER);toast('✓ Factory reset complete!');setTimeout(render,400);}
}

// ─── CHARTS ─────────────────────────────────────────────────────────────────
function drawCharts(tab,D){
  if(tab==='overview'){const am=D.actuals,fc=D.fc.burndown;const fcMap={};fc.forEach(m=>{fcMap[m.month]=m.forecast;});const actMap={};am.forEach(m=>{actMap[m.month]=m.actuals;});const labels=[...new Set([...Object.keys(fcMap),...Object.keys(actMap)])].sort((a,b)=>new Date('1 '+a)-new Date('1 '+b));const ctx=document.getElementById('c1');if(!ctx)return;charts.push(new Chart(ctx,{type:'bar',data:{labels,datasets:[{label:'Forecast (£)',data:labels.map(l=>fcMap[l]||null),backgroundColor:'rgba(33,150,243,0.7)'},{label:'Actuals (£)',data:labels.map(l=>actMap[l]||null),backgroundColor:'rgba(76,175,80,0.7)'}]},options:{responsive:true,plugins:{legend:{position:'top'}},scales:{y:{beginAtZero:true,ticks:{callback:v=>'£'+v.toLocaleString()}}}}}));}
  if(tab==='burndown'){const am=D.actuals,fm=D.fc.burndown;const allMonths=[...new Set([...am.map(m=>m.month),...fm.map(m=>m.month)])];const ctx=document.getElementById('c2');if(!ctx)return;
    // Actuals burn: PO_Available_at_month - cumulative actuals
    // Forecast burn: PO_Available_at_month - cumulative forecast
    // First compute cumPO per month
    const poArr=D.cfg.po_details||[];
    const normFilter2=selectedPoTeams.length?selectedPoTeams.map(t=>t.replace(/\s+/g,'')):null;
    const cumPO=allMonths.map(mKey=>{
      const [mName,yy]=mKey.split('-');const yr=parseInt('20'+yy);
      const mIdx=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'].indexOf(mName);
      const monthEnd=new Date(yr,mIdx+1,0).toISOString().slice(0,10);
      let total=0;
      poArr.forEach(p=>{
        const t=(p.PO_Team_Identifier||'').replace(/\s+/g,'');
        if(normFilter2&&!normFilter2.includes(t))return;
        if(p.WO_StartDate<=monthEnd&&p.PO_Validity_Year>=yr)total+=p.PO_WO_value;
      });
      return total;
    });
    // Now compute burn lines using cumPO as the baseline
    let cumAct=0;const actBurn=allMonths.map((l,i)=>{const m=am.find(x=>x.month===l);if(m&&m.actuals){cumAct+=m.actuals;return cumPO[i]-cumAct;}return null;});
    let cumFc=0;const fcBurn=allMonths.map((l,i)=>{const m=fm.find(x=>x.month===l);if(m){cumFc+=m.forecast;return cumPO[i]-cumFc;}return null;});
    const fcSpend=allMonths.map(l=>{const m=fm.find(x=>x.month===l);return m?m.forecast:null;});
    const actSpend=allMonths.map(l=>{const m=am.find(x=>x.month===l);return m?m.actuals:null;});
    charts.push(new Chart(ctx,{type:"bar",data:{labels:allMonths,datasets:[{label:"Forecast Spend",data:fcSpend,backgroundColor:"rgba(33,150,243,0.4)",order:2},{label:"Actuals Spend",data:actSpend,backgroundColor:"rgba(76,175,80,0.4)",order:2},{label:"Actuals Burn",type:"line",data:actBurn,borderColor:"#4caf50",borderWidth:2,tension:0.3,spanGaps:false,pointRadius:3,order:1,yAxisID:"y1"},{label:"Forecast Burn",type:"line",data:fcBurn,borderColor:"#2196f3",borderWidth:2,tension:0.3,pointRadius:3,order:1,yAxisID:"y1"},{label:"PO Available",type:"line",data:cumPO,borderColor:"#f44336",borderDash:[5,5],pointRadius:2,borderWidth:2,order:0,yAxisID:"y1"}]},options:{responsive:true,plugins:{legend:{position:"top"}},scales:{y:{position:"left",title:{display:true,text:"Monthly Spend"},beginAtZero:true,ticks:{callback:v=>"£"+v.toLocaleString()}},y1:{position:"right",title:{display:true,text:"PO Burn"},ticks:{callback:v=>"£"+v.toLocaleString()},grid:{drawOnChartArea:false}}}}}));
    // Normalized chart
    const today2=new Date().toISOString().slice(0,10);
    const fxF=fxRateAsOf(D.cfg.fx_rates,D.fc.currency||'GBP',today2);
    const fxT=fxRateAsOf(D.cfg.fx_rates,D.fc.normCurrency||'USD',today2);
    const norm=v=>v!=null?Math.round(v/fxF*fxT):null;
    const ctx2=document.getElementById('c2norm');
    if(ctx2){charts.push(new Chart(ctx2,{type:'line',data:{labels:allMonths,datasets:[
      {label:'Actuals Burn ('+D.fc.normCurrency+')',data:actBurn.map(norm),borderColor:'#4caf50',tension:0.3,spanGaps:false},
      {label:'Forecast Burn ('+D.fc.normCurrency+')',data:fcBurn.map(norm),borderColor:'#2196f3',tension:0.3},
      {label:'PO Available ('+D.fc.normCurrency+')',data:cumPO.map(norm),borderColor:'#f44336',borderDash:[5,5],pointRadius:2}
    ]},options:{responsive:true,plugins:{legend:{position:'top'}},scales:{y:{ticks:{callback:v=>'$'+v.toLocaleString()}}}}}));}
  }
  if(tab==='monthly'){const am=D.actuals,fc=D.fc.burndown;const fcMap={};fc.forEach(m=>{fcMap[m.month]=m.forecast;});const actMap={};am.forEach(m=>{actMap[m.month]=m.actuals;});const labels=[...new Set([...Object.keys(fcMap),...Object.keys(actMap)])].sort((a,b)=>new Date('1 '+a)-new Date('1 '+b));const varData=labels.map(l=>(actMap[l]!=null&&fcMap[l]!=null)?actMap[l]-fcMap[l]:null);const ctx=document.getElementById('c3');if(!ctx)return;charts.push(new Chart(ctx,{type:'bar',data:{labels,datasets:[{label:'Variance (Act−Fc)',data:varData,backgroundColor:varData.map(v=>v!=null?(v>0?'rgba(244,67,54,0.7)':'rgba(76,175,80,0.7)'):'rgba(200,200,200,0.3)')}]},options:{responsive:true,plugins:{legend:{position:'top'}},scales:{y:{ticks:{callback:v=>'£'+v.toLocaleString()}}}}}));}
}
render();
</script></body></html>
